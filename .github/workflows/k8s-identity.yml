# =============================================================================
# k8s-identity.yml  —  Contoso Health Identity Platform (lab/k8s)
# -----------------------------------------------------------------------------
# Builds a throwaway kind cluster on the runner and proves that a workload gets
# its database password with NO static secret in its path: no Kubernetes
# Secret, no env var, no manifest value. (The one bootstrap credential left is
# the dev-mode Vault root token the platform itself runs with, generated by
# pipeline.sh and gone with the cluster: lab/k8s/README.md section 6.) The pod
# logs in to Vault with a short-lived
# service-account token whose audience is "vault", and gets one secret. The
# same run checks Kubernetes RBAC for human groups (a can-i matrix), Pod
# Security Admission, a ValidatingAdmissionPolicy that binds the
# nightly-report identity to one image digest and to the release pipeline,
# rotation without a pod restart, Terraform drift detection (an out-of-band
# RoleBinding edit: plan exit 2, apply heals it), the API-server audit log, and
# that no secret value or the Vault root token is in Terraform state or the
# audit log. Everything is torn down at the end.
#
# The workflow is deliberately thin: every stage lives in
# lab/k8s/ci/pipeline.sh, the ONE script a human also runs on a laptop
# (KEEP_CLUSTER=1 keeps the cluster for a demo). CI and the laptop cannot
# drift, because there is nothing here for them to drift on.
#
# Stand-ins (lab/docs/STAND-INS.md): kind replaces AKS; Vault's Kubernetes auth
# method + Agent Injector replace CyberArk Secrets Manager / Conjur authn-k8s
# (or Entra Workload ID + the Key Vault CSI driver on AKS); the human groups
# are impersonated, where AKS would use Entra group object IDs.
#
# NO CLOUD CREDENTIALS: no id-token: write, no secrets, no repo variables. The
# cluster, Vault and its root token exist only on this runner for this run
# (pipeline.sh generates the token and never prints it). A fork PR therefore
# runs the full pipeline with nothing to steal.
#
# NOT A REQUIRED STATUS CHECK, on purpose. This workflow is path-filtered, and
# GitHub leaves a required check that a path filter skipped as "Pending"
# forever, which would block every unrelated PR (docs-only, Entra-only).
# The ruleset on main therefore requires only checks that run on every PR
# (terraform plan, checkov, trufflehog and the two lab-tests jobs;
# lab/pipelines/README.md §5 F) and does not add this one. To make it required, drop `paths:` and use job-level change
# detection, as terraform-plan.yml does.
#
# Supply chain: actions pinned to full commit SHAs (rationale in
# terraform-plan.yml and lab/pipelines/README.md §4). kind and kubectl are
# sha256-verified by pipeline.sh (whichever binary is on PATH; the pinned
# download replaces it on a version or hash mismatch). The kind node image,
# busybox and the vault / vault-k8s images (server, injector and the injected
# agent) are pinned by digest; the admission policy refuses any undigested
# image in clinical-apps. The Vault chart and Checkov are pinned by version
# only: accepted residual risk for an ephemeral lab cluster (see
# lab/terraform/k8s/platform/main.tf).
# =============================================================================

name: k8s identity pipeline

on:
  pull_request:
    paths:
      - "lab/k8s/**"
      - "lab/terraform/k8s/**"
      - ".github/workflows/k8s-identity.yml"
  workflow_dispatch: {}        # manual run, e.g. before recording the demo

# Read-only token, nothing else. Nothing in this run talks to a cloud API.
permissions:
  contents: read

# One run per PR (or per ref for a manual run); a new push cancels the old run.
# On cancel or timeout the runner signals only the step's outer shell and
# kills the step within seconds, so pipeline.sh's EXIT trap does not get to
# tear down: what cleans up is that the ephemeral runner VM (with its kind
# cluster) is discarded. The trap tears down on a normal pass or fail.
concurrency:
  group: k8s-identity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  k8s-identity:
    name: k8s identity (kind e2e)
    runs-on: ubuntu-latest          # x86_64: pipeline.sh fetches linux-amd64 kind + kubectl
    timeout-minutes: 30
    env:
      KEEP_CLUSTER: "0"             # always tear down in CI (pipeline.sh EXIT trap)
      TF_IN_AUTOMATION: "1"         # Terraform: no "run terraform apply next" hints
      TF_INPUT: "0"                 # a missing variable fails fast instead of hanging on a prompt
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false   # no token left in .git/config

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.16.5"  # same CLI that generated the three k8s roots' .terraform.lock.hcl
          # Off: pipeline.sh reads Terraform's real exit codes and output, and
          # nothing reads the wrapper's stdout/stderr/exitcode step outputs.
          terraform_wrapper: false

      # Python for Checkov, pinned to 3.12: the newest version in Checkov
      # 3.3.20's PyPI classifiers (3.9-3.12), so CI runs it on a declared-
      # supported interpreter whatever ubuntu-latest becomes (Ubuntu 26.04's
      # system python3 is 3.14). actions/python-versions publishes 3.12 builds
      # for Ubuntu 24.04 and 26.04 (checked 2026-10-20). The dev Mac's Homebrew
      # checkov 3.3.20 runs on Homebrew's own Python (3.15 when checked) and,
      # as the first CI run showed (2026-10-21), is NOT the same set of checks:
      # its package lacks every JSON-defined graph check
      # (*/checks/graph_checks/*.json), so CKV2_K8S_6 ("pods without a
      # NetworkPolicy") failed here and never ran there. For a local run that
      # matches CI, put a PyPI install first on PATH (python3.12 -m venv ...;
      # pip install checkov==3.3.20).
      - name: Setup Python (for Checkov)
        id: py
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # Checkov from PyPI, pinned exactly. 3.3.20 (uploaded 2026-09-27) is >= 2
      # weeks old, so a bad release has had time to be noticed and yanked, and
      # it is the Checkov version on the dev Mac (same version; the checks
      # match only when the local copy also comes from PyPI, see above).
      # Dependabot does not bump this pin (the repo has no pip ecosystem
      # entry): bump it by hand.
      # Own venv: keeps Checkov's dependencies out of every other Python on
      # the runner. Only the checkov entry point goes on PATH, not the venv's
      # python/pip.
      # A PyPI release file can never be replaced, so ==3.3.20 pins Checkov's
      # own code (wheel sha256 f6318b53...deb27); its ~50 direct dependencies
      # still resolve to the newest versions its ranges allow.
      # verify: `pip install --require-hashes` would need a generated, hashed
      # lock of every transitive dependency; optional for this lab.
      - name: Install Checkov (pinned)
        env:
          CHECKOV_VERSION: "3.3.20"
          PY: ${{ steps.py.outputs.python-path }}
        run: |
          py="${PY:?setup-python gave no python-path}"
          "$py" --version
          "$py" -m venv "${RUNNER_TEMP}/checkov-venv"
          "${RUNNER_TEMP}/checkov-venv/bin/pip" install --quiet --disable-pip-version-check "checkov==${CHECKOV_VERSION}"
          mkdir -p "${RUNNER_TEMP}/checkov-bin"
          ln -sf "${RUNNER_TEMP}/checkov-venv/bin/checkov" "${RUNNER_TEMP}/checkov-bin/checkov"
          echo "${RUNNER_TEMP}/checkov-bin" >> "$GITHUB_PATH"
          "${RUNNER_TEMP}/checkov-bin/checkov" --version
          # Refuse a Checkov whose package lost its JSON-defined graph checks
          # (as the Homebrew build has): it would pass stage 3 without ever
          # evaluating CKV2_K8S_* / CKV2_AZURE_*. The PyPI 3.3.20 wheel ships
          # 196 terraform + 6 kubernetes ones (counted 2026-10-21).
          for fw in kubernetes terraform; do
            n=$(find "${RUNNER_TEMP}/checkov-venv" -path "*/checkov/${fw}/checks/graph_checks/*.json" | wc -l)
            if [ "$n" -eq 0 ]; then
              echo "::error::This Checkov install has no ${fw} graph checks; refusing to scan with a partial check set."
              exit 1
            fi
            echo "checkov ${fw} graph checks: ${n}"
          done

      # The whole pipeline (12 stages): preflight, fmt/validate/test (incl. the
      # plan-only aks-mapping root, never applied), Checkov, kind, two
      # Terraform applies, secret seed, manifests, rotation, drift detect +
      # heal, e2e tests, secrets-out-of-state, then teardown. It prints a
      # per-stage PASS/FAIL table and exits non-zero on any failure.
      # `bash` explicitly, so a lost executable bit cannot break CI.
      - name: Run lab/k8s/ci/pipeline.sh
        run: bash lab/k8s/ci/pipeline.sh
