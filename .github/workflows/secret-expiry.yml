# Monthly expiry check of the long-lived NON-ENTRA secrets register
# (lab/iga/nhi-secrets-register.json). Hostile review 2026-11-06, finding H1.
#
# It reads one file in the repository. No sign-in, no cloud call, no secret:
# the register holds names, owner roles, store locations and dates only.
# A 60-day window on a monthly run gives every secret at least ~30 days'
# warning. A failed run is the alert (GitHub notifies the maintainers of a
# failed scheduled workflow). Rules: lab/scripts/powershell/Test-SecretExpiry.ps1.
# Entra app credentials are checked live by 06-NHI-Inventory.ps1 instead.
name: secret-expiry

on:
  schedule:
    - cron: "41 6 1 * *"       # 06:41 UTC on the 1st of each month (off the hour)
  workflow_dispatch: {}
  pull_request:
    paths:
      - lab/iga/nhi-secrets-register.json
      - lab/scripts/powershell/Test-SecretExpiry.ps1
      - .github/workflows/secret-expiry.yml

permissions:
  contents: read

jobs:
  expiry:
    name: secrets register expiry (60-day window)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check expiry dates and owners
        shell: pwsh
        run: ./lab/scripts/powershell/Test-SecretExpiry.ps1
