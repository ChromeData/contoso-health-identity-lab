# =============================================================================
# terraform-apply.yml  —  Contoso Health Identity Platform (lab/)
# -----------------------------------------------------------------------------
# Runs on push to main (i.e. after a PR is reviewed + merged), on a manual
# dispatch of main only, or on a repository_dispatch "apply-main" (always the
# default branch; the bot's recovery run, see below). Applies the Terraform
# using the WRITE-capable APPLY app registration over GitHub OIDC — again, NO
# stored credential. The human gate between "merged to main" and "changed the
# live tenant" is GitHub's Environment `prod` (required reviewer ChromeData,
# "Prevent self-review" on, admins cannot bypass, main only) (karen A1, A2):
#   1. job plan: terraform plan of main as the read-only PLAN app (NO
#      environment), plain-English summary, change set and a fingerprint of
#      every change (plan-fingerprint.py); checks (PR author, merger, bot
#      separation, change set vs the PR plan comment)
#   2. job terraform-apply: environment prod. The run pauses BEFORE this job
#      starts; the owner clicks Review deployments, reads job 1's summary,
#      ticks prod, clicks Approve and deploy. Only then does any step get the
#      APPLY identity. It plans again and applies only a plan with the SAME
#      fingerprint as the one reviewed (and reviewed under 60 minutes ago)
# An AI assistant never approves. "Prevent self-review" stops the account that
# started the run from approving it; the agents merge as the bot.
#
# Two-identity design (defence in depth):
#   - PLAN app  -> read-only Graph/Azure: pull_request plans, and the review
#                  plan here (job 1, subject ref:refs/heads/main)
#   - APPLY app -> write Graph/Azure: job 2 only, after the approval
# The federated credentials are scoped so the APPLY app can ONLY be assumed by
# a job in the `prod` environment (subject:
# repo:OWNER@OWNER_ID/REPO@REPO_ID:environment:prod), and the PLAN app only by
# pull_request and by main (ref:refs/heads/main, the same credential the
# nightly config-drift.yml uses). A fork PR gets no OIDC token at all, so it
# reaches neither identity. Why the review plan is NOT in `prod`: every job in
# `prod` waits for the reviewer, and the APPLY identity must stay behind that
# reviewer. A pre-approval job in `prod` would either pause before any plan
# exists (karen A2) or, with the reviewer removed, hand Contributor to any
# workflow on main without an approval (Greptile, PR #241).
#
# After a successful apply, the same job writes the automatic access rules
# (who gets each birthright access package) from lab/iga/birthright-rules.json
# with post-apply/Set-AutoAssignmentPolicies.ps1, as the same APPLY identity
# (app-only Microsoft Graph token from the azure/login session). Terraform
# creates the packages; it does not create automatic assignment policies.
#
# All third-party actions pinned to full commit SHA (see terraform-plan.yml for
# the Trivy-2026 supply-chain rationale).
# =============================================================================

name: terraform-apply

on:
  push:
    branches: [main]
    paths:
      - "lab/terraform/**"
      # The AWS root is human-applied from a laptop (lab/terraform/aws/README.md):
      # a merge touching only it must not start a reviewer-gated no-op Entra apply.
      # Order matters - the negation must follow the positive pattern.
      - "!lab/terraform/aws/**"
      # Same for the two Kubernetes roots: they only ever target an ephemeral
      # kind cluster, applied and destroyed by lab/k8s/ci/pipeline.sh
      # (k8s-identity.yml), never by this Entra apply.
      - "!lab/terraform/k8s/**"
      # And the lab operator root (envs/operator, ADR 0024): human-applied
      # from the admin's laptop, never by this pipeline.
      - "!lab/terraform/envs/operator/**"
      # The automatic access rules are applied by this workflow too (step
      # "Set who gets each automatic access package"), so a rule-only merge
      # must start it - otherwise the live policies lag the reviewed file.
      - "lab/iga/birthright-rules.json"
      - "lab/iga/access-catalog.json"
      - "lab/scripts/powershell/post-apply/Set-AutoAssignmentPolicies.ps1"
      - ".github/workflows/terraform-apply.yml"
      - ".github/scripts/pipeline-config.sh"
  workflow_dispatch: {}        # manual re-apply of main only; same prod approval
  # The bot's recovery run (lab/pipelines/README.md section 3, "Who is who").
  # POST /repos/{owner}/{repo}/dispatches needs only Contents: write, which
  # the bot already has; `gh workflow run` would need Actions: write (GitHub
  # docs, "Permissions required for GitHub Apps"). It runs the default
  # branch's copy of this file on the default branch's last commit (GitHub
  # docs, "Events that trigger workflows"), and it waits for the same prod
  # approval.
  repository_dispatch:
    types: [apply-main]

permissions:
  contents: read

# Never run two applies against the same tenant/state at once.
concurrency:
  group: tf-apply-prod
  cancel-in-progress: false

env:
  TF_WORKING_DIR: lab/terraform/envs/dev
  ARM_USE_OIDC: "true"
  ARM_CLIENT_ID: ${{ vars.AZURE_APPLY_CLIENT_ID }}     # APPLY app (write)
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  # Tenant identifiers (NOT secrets) come from repo Variables; policy knobs come
  # from the committed lab.tfvars so every flag / CA-state change is a
  # reviewable diff. List-typed vars fall back to '[]' when unset.
  TF_VAR_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  TF_VAR_tenant_id: ${{ vars.AZURE_TENANT_ID }}
  TF_VAR_key_vault_name: ${{ vars.TF_KEY_VAULT_NAME || 'kv-idlab' }}
  TF_VAR_onmicrosoft_domain: ${{ vars.TF_ONMICROSOFT_DOMAIN }}
  TF_VAR_pim_approver_object_ids: ${{ vars.TF_PIM_APPROVER_OBJECT_IDS || '[]' }}
  # PRIVACY values (operator IP ranges, alert email, app owner ids, SAML
  # certificate emails, PIM alert mailbox) are NOT here and NOT GitHub
  # secrets: step "Pipeline config from Key Vault" reads them with the APPLY
  # app's OIDC sign-in (envs/bootstrap pipeline-config.tf) and exports them
  # masked. No value is stored in GitHub.
  PIPELINE_CONFIG_VAULT: ${{ vars.TF_PIPELINE_CONFIG_VAULT || 'kv-idlab-cicd-20f1' }}
  TF_VAR_sentinel_playbook_id: ${{ vars.TF_SENTINEL_PLAYBOOK_ID }}
  TF_VAR_key_vault_secrets_officer_ids: ${{ vars.TF_KV_SECRETS_OFFICER_IDS || '[]' }}
  TF_VAR_access_review_fallback_group_object_id: ${{ vars.TF_ACCESS_REVIEW_FALLBACK_GROUP_OBJECT_ID }}
  # Access-package approver group (also the review fallback above when that is
  # unset). A group id, so a Variable; unset = '' = requestor's manager. Set
  # here, not only in a local terraform.tfvars, or this apply moves approval
  # back to the manager.
  TF_VAR_entitlement_approver_group_object_id: ${{ vars.TF_ENTITLEMENT_APPROVER_GROUP_OBJECT_ID }}
  TF_VAR_intune_vm_admin_login_object_ids: ${{ vars.TF_INTUNE_VM_ADMIN_LOGIN_OBJECT_IDS || '[]' }}
  # Senior-scope extensions (all staging flags live in lab.tfvars). Tenant
  # identifiers come from Variables; owner ids and the certificate mailbox
  # come from the pipeline config vault (masked per element) AND are
  # sensitive Terraform variables. aws_scim_credentials is
  # NEVER passed here: it is written once by a local seeding apply.
  TF_VAR_pim_tier0_approver_object_ids: ${{ vars.TF_PIM_TIER0_APPROVER_OBJECT_IDS || '[]' }}
  TF_VAR_privileged_review_reviewer_group_object_id: ${{ vars.TF_PRIVILEGED_REVIEW_REVIEWER_GROUP_OBJECT_ID }}
  TF_VAR_b2b_connected_organization_id: ${{ vars.TF_B2B_CONNECTED_ORGANIZATION_ID }}
  TF_VAR_ca008_pilot_group_object_id: ${{ vars.TF_CA008_PILOT_GROUP_OBJECT_ID }}
  TF_VAR_aws_saml_entity_id: ${{ vars.TF_AWS_SAML_ENTITY_ID }}
  TF_VAR_aws_saml_acs_urls: ${{ vars.TF_AWS_SAML_ACS_URLS || '[]' }}
  TF_VAR_aws_access_portal_url: ${{ vars.TF_AWS_ACCESS_PORTAL_URL }}
  TF_VAR_aws_scim_template_id: ${{ vars.TF_AWS_SCIM_TEMPLATE_ID }}
  # The APPLY app owns every app in modules/apps, whoever runs the plan.
  TF_VAR_apply_client_id: ${{ vars.AZURE_APPLY_CLIENT_ID }}
  TF_VAR_containment_playbook_id: ${{ vars.TF_CONTAINMENT_PLAYBOOK_ID }}
  # CA010-Exclusion-<reason> groups, excluded next to break-glass (group ids,
  # so a Variable). Unset = none. Set here, not only in a local
  # terraform.tfvars, or this apply removes the exception.
  TF_VAR_ca010_exception_group_object_ids: ${{ vars.TF_CA010_EXCEPTION_GROUP_OBJECT_IDS || '[]' }}
  # ServiceNow SAML app (enable_servicenow_sso in lab.tfvars): the instance
  # URL and, once the IdP record exists, its sys_id. Identifiers (like the AWS
  # portal URL), so Variables. Unset = '': nothing plans while the flag is
  # off, and the plan refuses the flag without the URL.
  TF_VAR_servicenow_instance_url: ${{ vars.TF_SERVICENOW_INSTANCE_URL }}
  TF_VAR_okta_org_domain: ${{ vars.TF_OKTA_ORG_DOMAIN }}
  TF_VAR_servicenow_sso_sys_id: ${{ vars.TF_SERVICENOW_SSO_SYS_ID }}
  # ITDR: the APPLY identity by immutable id (envs/bootstrap output
  # iac_principal_ids) and extra privileged users - JSON lists of GUIDs.
  TF_VAR_iac_principal_ids: ${{ vars.TF_IAC_PRINCIPAL_IDS || '[]' }}
  # The lab operator's ids (ADR 0024; envs/operator outputs) for the fourth
  # ITDR set (enable_itdr_detections_v4) - JSON list of GUIDs.
  TF_VAR_operator_principal_ids: ${{ vars.TF_OPERATOR_PRINCIPAL_IDS || '[]' }}
  TF_VAR_privileged_user_object_ids: ${{ vars.TF_PRIVILEGED_USER_OBJECT_IDS || '[]' }}
  TF_VAR_evidence_storage_account_name: ${{ vars.TF_EVIDENCE_STORAGE_ACCOUNT_NAME || 'stidlabevidence' }}
  # TF_B2B_CONNECTED_ORGANIZATION (an object) is passed on the plan step, not
  # here: see that step.
  # POLICY KNOBS ARE NOT TF_VAR_ HERE, on purpose: itdr_exclude_rules (set in
  # lab.tfvars) and evidence_immutability_days / _state / _lock_acknowledged
  # (added to lab.tfvars in the Day 28 lock PR) reach this apply through
  # -var-file=lab.tfvars. -var-file outranks TF_VAR_, so a
  # TF_VAR_itdr_exclude_rules would be silently ignored; and a repo Variable
  # for the evidence_immutability_* trio would let a settings change, with no
  # PR and no review, Lock the WORM store irreversibly.
  # Gated apply: refuse to CREATE the AWS SCIM credential empty (PR plans
  # only warn - they can never hold the token). modules/apps README.
  TF_VAR_require_scim_credentials: "true"

jobs:
  # Two jobs, in this order (the repo is public, so GitHub's own gate works):
  #   1. plan          - plan main as PLAN (read-only, no environment), show
  #                      the plan, run the checks
  #   2. terraform-apply - Environment `prod`: required reviewer ChromeData,
  #                      "Prevent self-review" on, admins cannot bypass. The
  #                      run pauses here with a "Review deployments" button.
  #                      After the approval: sign in as APPLY, plan again,
  #                      refuse unless the plan's fingerprint equals the
  #                      reviewed one, then apply that new plan file.
  # Why the apply plans again: GitHub asks for the approval BEFORE a job
  # starts, so the plan to review must come from an earlier job (else the
  # owner approves a plan that does not exist yet, karen-review A2). The saved
  # plan holds every variable value in clear text, and an artifact on a public
  # repo is downloadable by any signed-in GitHub user, so tfplan never leaves
  # its runner. plan-fingerprint.py hashes resources, actions AND values, so
  # anything that differs from the reviewed plan stops the apply.
  # Who is who: "Prevent self-review" stops the account that started the run
  # (the merger) from approving it. AI agents push and merge as the lab's
  # GitHub App bot (lab/scripts/operator/github-bot/bot-gh), the owner
  # approves. If the owner's own login merges, the owner cannot approve that
  # run. While APPLY_BOT_LOGIN is unset: start a new run as the bot (`bot-gh
  # gh api repos/ChromeData/contoso-health-identity-lab/dispatches -f
  # event_type=apply-main`). Once it is set, the gate refuses an owner-merged
  # commit on any trigger (on purpose); the bot lands the change again
  # through its own PR (lab/pipelines/README.md section 3).
  plan:
    name: plan for review (read-only PLAN app, nothing applied)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Defence in depth only: the real control is the deployment-branch policy
    # (main only) on both environments, because the APPLY subject
    # `environment:prod` carries no branch ref.
    if: github.ref == 'refs/heads/main'
    # NO environment, on purpose: then the OIDC subject is
    # ref:refs/heads/main, which only the read-only PLAN app trusts (its
    # github-main-drift credential, modules/pipeline-identity plan_main). This
    # job can never get the APPLY identity: that needs environment:prod, and
    # every job in `prod` waits for the reviewer. The same PLAN app plans every
    # PR (terraform-plan.yml), and TF_VAR_apply_client_id pins the app owner,
    # so its plan matches the APPLY app's plan; if one ever differs, the
    # fingerprint check in job 2 refuses (fail closed, nothing applied).
    env:
      ARM_CLIENT_ID: ${{ vars.AZURE_PLAN_CLIENT_ID }}      # PLAN app (read-only)
    permissions:
      id-token: write          # OIDC token for Entra federation (PLAN app)
      contents: read
      pull-requests: read      # find the merged PR, its merger and plan comment
      actions: read            # last successful apply = the dispatch range base (R3)
    outputs:
      fingerprint: ${{ steps.fingerprint.outputs.fingerprint }}
      planned_at: ${{ steps.fingerprint.outputs.planned_at }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Azure login (OIDC, PLAN app, read-only)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_PLAN_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # The five privacy values, from Key Vault, as the PLAN app (Key Vault
      # Secrets User on that vault only), so the reviewed plan sees the same
      # values as the apply job's plan and the fingerprints match. Fails
      # closed: a value it cannot read stops the job.
      - name: Pipeline config from Key Vault (OIDC, no stored secret)
        run: .github/scripts/pipeline-config.sh

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.16.5"  # same CLI that generated the committed .terraform.lock.hcl files
          terraform_wrapper: false

      - name: terraform init
        run: |
          terraform init -input=false \
            -backend-config="resource_group_name=${{ vars.TFSTATE_RG }}" \
            -backend-config="storage_account_name=${{ vars.TFSTATE_STORAGE_ACCOUNT }}"
        working-directory: ${{ env.TF_WORKING_DIR }}

      - name: terraform plan (the plan the owner reviews)
        # -lock=false: this plan is for reading only; the apply job takes the
        # lock for its own plan + apply. Same B2B rule as terraform-plan.yml.
        env:
          B2B_CONNECTED_ORGANIZATION: ${{ vars.TF_B2B_CONNECTED_ORGANIZATION }}
        run: |
          if [ -n "${B2B_CONNECTED_ORGANIZATION}" ]; then
            export TF_VAR_b2b_connected_organization="${B2B_CONNECTED_ORGANIZATION}"
          fi
          terraform plan -input=false -no-color -lock=false -var-file=lab.tfvars -out=tfplan
        working-directory: ${{ env.TF_WORKING_DIR }}

      # Plain English, change set and fingerprint. The JSON plan (every
      # variable value in clear text) stays in RUNNER_TEMP, is never printed,
      # and is deleted on exit. NOT continue-on-error for the fingerprint:
      # without it the apply job cannot prove it applies the reviewed plan.
      - name: Plan summary, change set and fingerprint
        id: fingerprint
        run: |
          plan_json="${RUNNER_TEMP}/plan.json"
          trap 'rm -f "$plan_json"' EXIT
          terraform show -json tfplan > "$plan_json"
          python3 "${GITHUB_WORKSPACE}/.github/scripts/plain-plan.py" "$plan_json" > "${RUNNER_TEMP}/plain-plan.md" \
            || echo "(plain-English summary failed; the change set below is complete)" > "${RUNNER_TEMP}/plain-plan.md"
          "${GITHUB_WORKSPACE}/.github/scripts/plan-changeset.sh" "$plan_json" > "${RUNNER_TEMP}/changeset.txt"
          fp=$(python3 -I "${GITHUB_WORKSPACE}/.github/scripts/plan-fingerprint.py" "$plan_json")
          printf '%s' "$fp" | grep -Eq '^[0-9a-f]{64}$' || { echo "::error::no plan fingerprint"; exit 1; }
          echo "fingerprint=$fp" >> "$GITHUB_OUTPUT"
          echo "planned_at=$(date +%s)" >> "$GITHUB_OUTPUT"
          echo "Plan fingerprint: $fp"
          cat "${RUNNER_TEMP}/changeset.txt"
        working-directory: ${{ env.TF_WORKING_DIR }}

      # The checks of apply-approval-gate.sh in GATE_MODE=check: PR author and
      # merger, bot separation (APPLY_BOT_LOGIN), change set vs the PR plan
      # comment (refuses on a mismatch). It writes the plan to this job's
      # summary for the reviewer. It opens no issue and waits for nothing.
      # karen-review round 2, R3: a dispatch applies everything merged since
      # the last successful apply. The gate lists every PR in that range.
      # Fails closed: an unreadable run list stops the job.
      - name: Last successful apply (range for a dispatch)
        id: range
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          base=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/terraform-apply.yml/runs?status=success&branch=main&per_page=1" --jq '.workflow_runs[0].head_sha // empty') \
            || { echo "::error::could not read the last successful apply"; exit 1; }
          echo "base=$base" >> "$GITHUB_OUTPUT"

      - name: Checks and the plan for the reviewer
        env:
          APPLY_RANGE_BASE: ${{ steps.range.outputs.base }}
          APPLY_RANGE_STRICT: ${{ vars.APPLY_RANGE_STRICT }}
          GATE_MODE: check
          PLAN_LABEL: Plan fingerprint (resources, actions and values)
          GH_TOKEN: ${{ github.token }}
          APPLY_APPROVERS: ${{ vars.APPLY_APPROVERS }}
          APPLY_BOT_LOGIN: ${{ vars.APPLY_BOT_LOGIN }}
          PLAN_SHA256: ${{ steps.fingerprint.outputs.fingerprint }}
          PLAN_CHANGESET_FILE: ${{ runner.temp }}/changeset.txt
          PLAN_SUMMARY_FILE: ${{ runner.temp }}/plain-plan.md
        run: .github/scripts/apply-approval-gate.sh

  # The human gate is THIS job's Environment, `prod` (repo Settings ->
  # Environments, not in code, so no pull request can remove it): required
  # reviewer ChromeData, "Prevent self-review" on, "Allow administrators to
  # bypass" off, deployment branches: main only. GitHub pauses the run before
  # the job starts, so no step below (and no APPLY token) exists until the
  # owner approves. Job 1's summary is the plan the owner reads.
  terraform-apply:
    name: terraform apply (prod, the approved plan only)
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: github.ref == 'refs/heads/main'
    environment:
      name: prod
    permissions:
      id-token: write          # OIDC token for Entra federation (APPLY app)
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Azure login (OIDC, APPLY app)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_APPLY_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # The five privacy values, from Key Vault, as the APPLY app (Key Vault
      # Secrets User on that vault only). Fails closed: an apply never runs
      # on a value it could not read.
      - name: Pipeline config from Key Vault (OIDC, no stored secret)
        run: .github/scripts/pipeline-config.sh

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.16.5"  # same CLI that generated the committed .terraform.lock.hcl files
          terraform_wrapper: false

      - name: terraform init
        run: |
          terraform init -input=false \
            -backend-config="resource_group_name=${{ vars.TFSTATE_RG }}" \
            -backend-config="storage_account_name=${{ vars.TFSTATE_STORAGE_ACCOUNT }}"
        working-directory: ${{ env.TF_WORKING_DIR }}

      - name: terraform plan (fresh, saved to file)
        env:
          B2B_CONNECTED_ORGANIZATION: ${{ vars.TF_B2B_CONNECTED_ORGANIZATION }}
        run: |
          if [ -n "${B2B_CONNECTED_ORGANIZATION}" ]; then
            export TF_VAR_b2b_connected_organization="${B2B_CONNECTED_ORGANIZATION}"
          fi
          terraform plan -input=false -no-color -lock-timeout=120s -var-file=lab.tfvars -out=tfplan
        working-directory: ${{ env.TF_WORKING_DIR }}

      # Same plain-English summary, kept for the Apply summary below.
      # continue-on-error: a summary bug never blocks or fails the apply.
      - name: What this apply will change (plain English)
        id: summary
        continue-on-error: true
        run: |
          plan_json="${RUNNER_TEMP}/plan.json"
          trap 'rm -f "$plan_json" "${RUNNER_TEMP}"/plain-*.md.tmp' EXIT
          terraform show -json tfplan > "$plan_json"
          script="${GITHUB_WORKSPACE}/.github/scripts/plain-plan.py"
          python3 "$script" "$plan_json" > "${RUNNER_TEMP}/plain-plan.md.tmp"
          python3 "$script" --applied "$plan_json" > "${RUNNER_TEMP}/plain-applied.md.tmp"
          mv "${RUNNER_TEMP}/plain-plan.md.tmp" "${RUNNER_TEMP}/plain-plan.md"
          mv "${RUNNER_TEMP}/plain-applied.md.tmp" "${RUNNER_TEMP}/plain-applied.md"
          cat "${RUNNER_TEMP}/plain-plan.md"
        working-directory: ${{ env.TF_WORKING_DIR }}

      # The approved plan only: this plan's fingerprint must equal the one
      # the owner reviewed in job 1, and the review must be recent (60
      # minutes from plan to apply). Anything else (another merge, a portal
      # edit, a changed Variable, a different value) stops here, nothing
      # applied. Recovery: re-run the workflow and review the new plan.
      - name: Refuse unless this is the approved plan
        env:
          APPROVED_FINGERPRINT: ${{ needs.plan.outputs.fingerprint }}
          PLANNED_AT: ${{ needs.plan.outputs.planned_at }}
        run: |
          plan_json="${RUNNER_TEMP}/plan-fp.json"
          trap 'rm -f "$plan_json"' EXIT
          terraform show -json tfplan > "$plan_json"
          now_fp=$(python3 -I "${GITHUB_WORKSPACE}/.github/scripts/plan-fingerprint.py" "$plan_json")
          if [ -z "${APPROVED_FINGERPRINT}" ] || [ "$now_fp" != "${APPROVED_FINGERPRINT}" ]; then
            echo "::error::Refused: this plan (${now_fp:0:12}) is not the approved plan (${APPROVED_FINGERPRINT:0:12}). Nothing applied. Re-run and review the new plan."
            exit 1
          fi
          age=$(( $(date +%s) - PLANNED_AT ))
          if [ "$age" -gt 3600 ]; then
            echo "::error::Refused: the reviewed plan is ${age}s old (limit 3600s). Nothing applied. Re-run and review again."
            exit 1
          fi
          echo "Plan fingerprint matches the approved plan (${now_fp:0:12}); ${age}s since review plan"
        working-directory: ${{ env.TF_WORKING_DIR }}

      - name: terraform apply
        id: apply
        run: terraform apply -input=false -no-color -auto-approve tfplan
        working-directory: ${{ env.TF_WORKING_DIR }}

      # ---- Automatic access rules (birthright, ADR 0012 T3) -------------------
      # Terraform creates the automatic access packages but not WHO gets them:
      # that is one automatic assignment policy per package, built from
      # lab/iga/birthright-rules.json (department + job title) by
      # Set-AutoAssignmentPolicies.ps1. It runs here, in the same job, only
      # after a SUCCESSFUL apply (the packages must exist), as the same APPLY
      # identity. Its baseline Graph roles already cover it
      # (EntitlementManagement.ReadWrite.All; Group/User.ReadWrite.All cover
      # the reads), pinned by tests/AutoAssignmentPipeline.Tests.ps1.
      #
      # NOT continue-on-error, on purpose. By now the Terraform change is
      # live, and a failure here means a birthright package hands its access
      # to the wrong people or to nobody: the script's own safety checks
      # stopped (a package reaching a privileged group, tenant groups that do
      # not match the catalog, two automatic rules, nobody in scope with a
      # hire date, an automatic rule on a request-only package), or Microsoft
      # refused (403). Marking that green would hide exactly the failure the
      # summary exists to show. Instead the run goes red, the Apply summary
      # below says the Terraform part IS live and what stopped, and
      # re-running the workflow is safe (apply and script are idempotent).
      #
      # A fresh azure/login first: GitHub's OIDC token is short-lived, and
      # after a long apply the Azure CLI could no longer swap it for a Graph
      # token (AADSTS700024). Same APPLY app, same environment:prod subject.
      - name: Sign in again for Microsoft Graph (APPLY app, fresh OIDC token)
        if: steps.apply.outcome == 'success'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_APPLY_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Install the pinned Microsoft Graph module
        if: steps.apply.outcome == 'success'
        shell: pwsh
        run: |
          # PSGallery is sometimes slow to answer on a fresh runner: retry (as lab-tests.yml does).
          for ($i = 1; $i -le 4; $i++) {
            try {
              if (-not (Get-PSRepository -Name PSGallery -ErrorAction SilentlyContinue)) { Register-PSRepository -Default -ErrorAction Stop }
              Set-PSRepository -Name PSGallery -InstallationPolicy Trusted -ErrorAction Stop
              Install-Module Microsoft.Graph.Authentication -RequiredVersion 2.41.2 -Scope CurrentUser -Force -ErrorAction Stop
              break
            } catch {
              if ($i -eq 4) { throw }
              Write-Warning "Install-Module failed (attempt $i): $($_.Exception.Message); retrying"
              Start-Sleep -Seconds (10 * $i)
            }
          }

      - name: Set who gets each automatic access package (birthright rules)
        id: autoassign
        if: steps.apply.outcome == 'success'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $plain = Join-Path $env:RUNNER_TEMP 'plain-autoassign.md'
          $tech = Join-Path $env:RUNNER_TEMP 'tech-autoassign.md'
          # enable_governance off in lab.tfvars = no access packages: nothing to set.
          $raw = terraform -chdir="$env:TF_WORKING_DIR" output -json birthright_package_names 2>$null
          if ($LASTEXITCODE -eq 0 -and -not @(($raw | Out-String) | ConvertFrom-Json | Where-Object { $_ })) {
            '- Automatic access rules: not used here (access packages are switched off in lab.tfvars).' | Set-Content -LiteralPath $plain -Encoding utf8NoBOM
            exit 0
          }
          # -Confirm:$false: the human gate was the prod approval before this job; the script's
          # own refusals still apply. Package names and rule text only in the
          # log; the Graph token is masked and never printed. The pinned
          # module first (a different one on the runner image would load instead).
          Import-Module Microsoft.Graph.Authentication -RequiredVersion 2.41.2 -ErrorAction Stop
          $global:LASTEXITCODE = 0
          ./lab/scripts/powershell/post-apply/Set-AutoAssignmentPolicies.ps1 -UseAzureCliToken -Confirm:$false `
            -SummaryPath $plain -SummaryDetailsPath $tech | Format-Table -AutoSize Package, Action, Detail | Out-String -Width 4096
          exit $LASTEXITCODE

      # Plain-English result first ("Applied: ..." from the summary step, then
      # the automatic access rules), then the technical lines. Only says
      # "Applied" when the apply step succeeded.
      - name: Apply summary
        if: always()
        env:
          APPLY_OUTCOME: ${{ steps.apply.outcome }}
          AUTOASSIGN_OUTCOME: ${{ steps.autoassign.outcome }}
          JOB_STATUS: ${{ job.status }}
        run: |
          applied="${RUNNER_TEMP}/plain-applied.md"
          planned="${RUNNER_TEMP}/plain-plan.md"
          autoassign_plain="${RUNNER_TEMP}/plain-autoassign.md"
          autoassign_tech="${RUNNER_TEMP}/tech-autoassign.md"
          {
            echo "## Terraform apply — \`${{ env.TF_WORKING_DIR }}\`"
            echo ""
            case "${APPLY_OUTCOME}" in
              success)
                if [ -s "$applied" ]; then
                  cat "$applied"
                else
                  echo "**Applied.** (No plain-English summary this time; the \"terraform plan\" step log lists the changes.)"
                fi
                # Who gets each automatic access package (the step after the apply).
                echo ""
                if [ -s "$autoassign_plain" ]; then
                  cat "$autoassign_plain"
                else
                  echo "- **Automatic access rules not checked:** the run stopped before that step reached Microsoft (see the steps after \"terraform apply\"). Nothing was changed by it."
                fi
                # job.status here = every step so far: red after a good apply
                # means the sign-in, module install or access-rule step failed.
                if [ "${JOB_STATUS}" != "success" ]; then
                  echo ""
                  echo "**The run is marked failed, but the Terraform changes above are live.** A step after the apply stopped: the line above says what. Re-running this workflow is safe."
                fi ;;
              failure|cancelled)
                echo "**The apply did not finish (${APPLY_OUTCOME}).** Some of these planned changes may not be live; the \"terraform apply\" step log shows where it stopped."
                if [ -s "$planned" ]; then echo ""; cat "$planned"; fi ;;
              *)
                echo "**Nothing was applied.** The run stopped before the apply step (see the steps above)." ;;
            esac
            echo ""
            echo "**Technical details**"
            echo ""
            echo "- commit: \`${{ github.sha }}\`"
            echo "- actor:  \`${{ github.actor }}\`"
            echo "- result: \`${{ job.status }}\`"
            echo "- identity: APPLY app via OIDC (no stored credential); the automatic access rules use an app-only Microsoft Graph token from the same sign-in (masked, never printed)"
            if [ -s "$autoassign_tech" ]; then cat "$autoassign_tech"; fi
          } >> "$GITHUB_STEP_SUMMARY"
