# =============================================================================
# lab-tests.yml  —  Contoso Health Identity Platform (lab/)
# -----------------------------------------------------------------------------
# The offline test suites, on every pull request and on main. NO cloud
# credentials, NO OIDC token, NO tenant: every Terraform provider is mocked
# (terraform test with mock_provider) and every Graph / az call in the
# PowerShell suites is a Pester mock. What this proves is that the code does
# what its comments say; whether Entra accepts each call is a tenant-time
# check (the "verify:" notes in each file).
#
# Why a separate workflow from terraform-plan.yml: that one needs the PLAN
# identity and a real tenant; this one must stay green and meaningful before
# any tenant exists, and must never be handed a credential.
#
# Supply chain: actions pinned to full commit SHAs (same pins and rationale as
# terraform-plan.yml); PowerShell modules pinned to exact versions; the one
# downloaded fixture (CISA's ScubaGear sample) is verified against pinned
# SHA-256 hashes before any test reads it.
# =============================================================================

name: lab-tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: lab-tests-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Terraform: fmt, then init (no backend) + validate in every root and module,
  # and terraform test wherever a tests/ folder exists (mocked providers).
  # ---------------------------------------------------------------------------
  terraform-test:
    name: terraform validate + test (mocked)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.16.5"  # the CLI the committed lock files and mocks were built with
          terraform_wrapper: false

      - name: terraform fmt -check
        run: terraform fmt -check -recursive lab/terraform

      - name: validate + test every root and module
        # Roots verify providers against their committed lock file
        # (-lockfile=readonly); child modules have none (gitignored).
        # envs/dev's tests run with the committed lab.tfvars, like CI's plan.
        # ${arr[@]+"${arr[@]}"}: empty arrays stay safe under `set -u` on any
        # bash (the same loop is run locally on macOS bash 3.2).
        run: |
          set -uo pipefail
          fail=0
          dirs="lab/terraform/envs/dev lab/terraform/envs/bootstrap lab/terraform/envs/operator lab/terraform/aws lab/terraform/okta lab/terraform/k8s/platform lab/terraform/k8s/identity lab/terraform/k8s/keyvault-trust"
          for m in lab/terraform/modules/*/; do dirs="$dirs ${m%/}"; done
          for d in $dirs; do
            echo "::group::$d"
            lock=()
            [ -f "$d/.terraform.lock.hcl" ] && lock=(-lockfile=readonly)
            if ! terraform -chdir="$d" init -backend=false -input=false -no-color ${lock[@]+"${lock[@]}"}; then
              echo "::error::init failed in $d"; fail=1; echo "::endgroup::"; continue
            fi
            terraform -chdir="$d" validate -no-color || { echo "::error::validate failed in $d"; fail=1; }
            if compgen -G "$d/tests/*.tftest.hcl" > /dev/null; then
              vf=()
              [ -f "$d/lab.tfvars" ] && vf=(-var-file=lab.tfvars)
              terraform -chdir="$d" test -no-color ${vf[@]+"${vf[@]}"} || { echo "::error::terraform test failed in $d"; fail=1; }
            fi
            echo "::endgroup::"
          done
          exit "$fail"

      - name: Conjur secret in Terraform state, measured (lab/pam/conjur/state-leak)
        # A throwaway Conjur OSS in Docker and a random value; no credential
        # from this repo or GitHub is used. Exit 0 only if the data source path
        # puts the value in state and the ephemeral path reads it (precondition,
        # with a negative control) and keeps it out of state, backup and plan.
        # Same Terraform as the step above (HashiCorp, the pinned version).
        run: |
          set -euo pipefail
          terraform fmt -check -recursive lab/pam/conjur/state-leak
          bash lab/pam/conjur/state-leak/run.sh

  # ---------------------------------------------------------------------------
  # PowerShell: PSScriptAnalyzer (errors fail) + every Pester suite, the ITDR
  # suite, and the shell tests that need no containers.
  # ---------------------------------------------------------------------------
  # ---------------------------------------------------------------------------
  # Positive control for the merge gate's scanners (ADR 0026). Runs the SAME
  # Checkov and TruffleHog images as terraform-plan.yml on a deliberately
  # unsafe fixture (must be caught) and its clean twin (must pass), counting
  # findings from each tool's JSON. Fails if either scanner sees 0 on the
  # unsafe fixture, flags the clean one, crashes or scans nothing. The
  # planted secret is generated at run time; nothing secret-shaped is
  # committed. No credentials; both containers run with --network none.
  # ---------------------------------------------------------------------------
  scanner-positive-control:
    name: scanner positive control (Checkov + TruffleHog must fail on bad)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Self-test (pinned images, as the gate runs them)
        run: bash lab/pipelines/scanner-selftest/selftest.sh

  powershell-test:
    name: Pester + PSScriptAnalyzer + shell tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Install pinned PowerShell modules
        # The Graph modules are loaded only so Pester mocks copy the REAL
        # cmdlet signatures (a call with a wrong parameter name fails a test).
        shell: pwsh
        run: |
          # PSGallery is sometimes missing or unreachable on a fresh runner ("No repository with
          # the name 'PSGallery' was found"); (re)register it with retries before trusting it.
          for ($i = 1; $i -le 4; $i++) {
              try {
                  if (-not (Get-PSRepository -Name PSGallery -ErrorAction SilentlyContinue)) { Register-PSRepository -Default -ErrorAction Stop }
                  Set-PSRepository -Name PSGallery -InstallationPolicy Trusted -ErrorAction Stop
                  break
              } catch {
                  if ($i -eq 4) { throw }
                  Write-Warning "PSGallery not ready (attempt $i): $($_.Exception.Message); retrying"
                  Start-Sleep -Seconds (15 * $i)
              }
          }
          # PSGallery downloads fail transiently ("Source Location ... is not valid"); retry each module.
          function Install-Pinned([string]$Name, [string]$Version, [switch]$SkipPublisherCheck) {
              for ($i = 1; $i -le 4; $i++) {
                  try {
                      Install-Module $Name -RequiredVersion $Version -Scope CurrentUser -Force -SkipPublisherCheck:$SkipPublisherCheck -ErrorAction Stop
                      return
                  } catch {
                      if ($i -eq 4) { throw }
                      Write-Warning "Install-Module $Name $Version failed (attempt $i): $($_.Exception.Message); retrying"
                      Start-Sleep -Seconds (10 * $i)
                  }
              }
          }
          Install-Pinned Pester 5.7.1 -SkipPublisherCheck
          Install-Pinned PSScriptAnalyzer 1.25.0
          foreach ($m in 'Microsoft.Graph.Authentication', 'Microsoft.Graph.Users', 'Microsoft.Graph.Users.Actions',
                         'Microsoft.Graph.Groups', 'Microsoft.Graph.Identity.Governance', 'Microsoft.Graph.Identity.DirectoryManagement',
                         'Microsoft.Graph.Applications', 'Microsoft.Graph.Identity.SignIns', 'Microsoft.Graph.Reports') {
              Install-Pinned $m 2.41.2
          }

      - name: PyYAML (ScubaGear config YAML check)
        run: sudo apt-get install -y --no-install-recommends python3-yaml

      - name: Fetch CISA ScubaGear v1.8.0 sample (SHA-256 pinned)
        shell: pwsh
        run: ./lab/scripts/powershell/tests/fixtures/Get-ScubaSample.ps1

      - name: Lab PowerShell suite (analyzer + Pester)
        shell: pwsh
        run: ./lab/scripts/powershell/tests/Invoke-LabTests.ps1 -CI

      - name: ITDR Pester suite
        shell: pwsh
        run: |
          Import-Module Pester -RequiredVersion 5.7.1
          $c = New-PesterConfiguration
          $c.Run.Path = @('./lab/scripts/monitoring/tests/Itdr.Tests.ps1', './lab/pam/test/Get-AccountDependencies.Tests.ps1', './lab/adfs/tests/ConnectHealth.Tests.ps1')
          $c.Run.Exit = $true
          $c.Output.Verbosity = 'Normal'
          Invoke-Pester -Configuration $c

      - name: Shell tests (no containers)
        run: |
          set -euo pipefail
          bash lab/scripts/monitoring/tests/ingest-vault-audit.test.sh
          bash lab/scripts/demo/tests/reset-demo-hire.test.sh
          bash lab/scripts/demo/tests/close-build-noise.test.sh
          # Break-glass rotation: stub az + stub Keychain, no tenant (PR #226).
          bash lab/scripts/break-glass/tests/rotate-password.test.sh
          node --test lab/scripts/demo/signin/tests/lib.test.mjs lab/scripts/demo/signin/tests/enroll.test.mjs lab/scripts/demo/signin/tests/identity.test.mjs
          node --test lab/terraform/okta/tests/trust-claims.test.mjs
          # Contoso HR form (lab/hr-app, ADR 0027): roster rules, API, GitHub store (fake gh).
          node --test lab/hr-app/tests/hr-app.test.mjs
          # Okta -> Entra migration tools: EL->Entra rule translation, tracker, System Log filter, the app's ID-token check (no network).
          node --test lab/okta-migration/tests/lib.test.mjs
          bash lab/scripts/demo/tests/containment-drill.test.sh
          # The scanner positive control's own failure modes (stub scanners).
          bash lab/pipelines/scanner-selftest/tests/selftest.test.sh
          (cd lab/splunk && ./render-savedsearches.sh --check)
          # Splunk live feed: watermark, de-dup, HEC failures, LaunchAgent template,
          # preflight verdict (fake Log Analytics, an HEC stub on 127.0.0.1; stdlib only).
          python3 -I -m unittest discover -s lab/scripts/monitoring/tests -p 'test_feed_splunk_live.py' -v
          # Pure parts of the lab passkey tool (no browser, Graph or Keychain);
          # node is preinstalled on ubuntu-latest, node:test needs no package.
          node --test lab/scripts/demo/tests/passkey.test.mjs
          # Connect Health registration token helper (ADR 0031): PKCE, the
          # authorize URL, and the claim checks that refuse a non-MFA token.
          node --test lab/adfs/connect-health/tests/get-agent-token.test.mjs
          # ... and the registration account's lifecycle (a later apply cannot
          # switch on an account register.sh close turned off).
          node --test lab/adfs/connect-health/tests/registration-lifecycle.test.mjs
          # The PAM harness's scripted-session client verdicts (fake Guacamole
          # tunnel on 127.0.0.1, stdlib only): the nightly pam-harness run is
          # not on pull requests, so this is where a PR breaking them fails.
          python3 -I lab/pam/test/guac_tunnel.test.py
          # ... and the scrubber pam-harness.yml runs before uploading failure logs.
          python3 -I lab/pam/test/scrub_logs.test.py
          # Kubernetes RBAC linter (lab/k8s/rbac-lint): unit tests, then the
          # canary that proves it still finds its planted risky roles in all
          # three input shapes (PyYAML from the apt step above; no cluster).
          python3 -I -m unittest discover -s lab/k8s/rbac-lint/tests -v
          bash lab/k8s/rbac-lint/canary.sh
          # AD FS -> Entra claims diff (lab/adfs/compare): the before/after
          # verdict the cutover proof depends on (stdlib only).
          python3 -I -m unittest discover -s lab/adfs/compare/tests -v
          # The counter behind the Conjur state-leak result (stdlib only).
          python3 -I -m unittest discover -s lab/pam/conjur/state-leak/tests -v
          # kusto-harness run-on-workspace.py: result decoding and verdict
          # (no workspace; the live runs are operator runs, capture log E114).
          python3 -I -m unittest discover -s lab/monitoring/kusto-harness/tests -p 'test_*.py' -v

      # The plain-English plan/apply summaries run with continue-on-error in
      # terraform-plan.yml / terraform-apply.yml (a summary bug must never
      # block an apply), so THIS is the check that fails when one breaks.
      - name: Plain-English summary tests (plain-plan.py)
        run: python3 -m unittest discover -s .github/scripts/tests -p 'test_*.py' -v
