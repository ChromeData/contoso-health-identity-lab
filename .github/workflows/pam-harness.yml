# =============================================================================
# pam-harness.yml  —  Contoso Health Identity Platform (lab/pam)
# -----------------------------------------------------------------------------
# The PAM harness's default suites, from a FRESH CLONE on a fresh runner:
# `cd lab/pam && ./test/run-all.sh`. That means no `.env`, no `.secrets/`, no
# Docker volumes and no images left over from an earlier run, which is the
# case a laptop run never covers (every run on the author's laptop reuses the
# shared stack's containers and its existing `.env`). The run's console
# output and the per-suite table in the job summary are the evidence, with a
# GitHub timestamp and a commit anyone can resolve.
#
# What it runs (lab/pam/README.md, "Test suites and the runner"): the PAM flow
# against a Samba AD DC (e2e, with the 3-node HA cluster and the DR drill),
# the midPoint campaign, dynamic database credentials and the Vault audit
# feed, all in Docker on the runner; plus the offline suites (dependency-scan
# Pester tests, the ingest script, dual control against the ServiceNow mock,
# the recording-format check, the scripted-session client's verdicts in
# tunnel-client). The optional 500-account `scale` suite is not run here
# (add a dispatch input if it is ever wanted).
#
# NO CLOUD CREDENTIALS: no id-token: write, no secrets, no repo variables. The
# harness generates every lab credential (`pam-up.sh` writes `.env` and
# `.secrets/` on the runner); they live only for this run and are never
# printed or uploaded. A PASSING run uploads nothing: only the console output
# and the PASS / FAIL counts leave the runner. A FAILING run also uploads its
# logs (suite logs, guacd / guacamole / rdp-target container logs) as an
# artifact kept 7 days, so a failure can be read instead of guessed at - but
# only after test/scrub_logs.py has taken out every credential this run
# generated (exact values from .env and every .secrets/ file, plus token,
# JWT, private-key and long-token shapes; suite log-scrub tests it). The
# scrub fails closed: if it cannot run, nothing is uploaded. What stays in
# them is the synthetic harness accounts and operators (tier0-admin-01,
# ops-alice, ...), which are names, not credentials.
#
# Not on pull requests, on purpose: a full run takes several minutes and
# pulls every stand-in image (Vault, Guacamole, Conjur, midPoint, PostgreSQL).
# It runs on demand and nightly. It is therefore never a required check.
#
# Supply chain: actions pinned to full commit SHAs (same pins and rationale as
# terraform-plan.yml); Pester pinned to the version lab-tests.yml uses. The
# stand-in images are pinned by version in lab/pam/docker-compose*.yml (the
# test-only projects by digest); the four local images are built on the
# runner from lab/pam.
# =============================================================================

name: pam harness

on:
  workflow_dispatch: {}
  schedule:
    - cron: "23 5 * * *"       # nightly, 05:23 UTC (off the hour)

# Read-only token, nothing else. Nothing in this run talks to a cloud API.
permissions:
  contents: read

concurrency:
  group: pam-harness-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pam-run-all:
    name: PAM run-all (fresh clone, local Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Install pinned Pester (dependency-scan suite)
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force -SkipPublisherCheck

      # Proves the "fresh" in fresh clone before anything starts: no generated
      # credentials, no harness output, no volumes or containers from a run.
      - name: Fresh state (no .env, no secrets, no volumes)
        run: |
          set -euo pipefail
          for p in lab/pam/.env lab/pam/.secrets lab/pam/out lab/pam/dynamic-db/.secrets; do
            if [ -e "$p" ]; then echo "::error::$p exists before the run"; exit 1; fi
          done
          # Only the harness's own compose projects (lab/pam/**/docker-compose*):
          # a bare ^contoso- also matched unrelated local stacks (Splunk, kind).
          h='^contoso-(pam|pam-ha|pamscale|dyndb|vaultanom)[_-]'
          if docker volume ls --format '{{.Name}}' | grep -E "$h"; then
            echo "::error::contoso-* Docker volumes exist before the run"; exit 1
          fi
          if docker ps -a --format '{{.Names}}' | grep -E "$h"; then
            echo "::error::contoso-* containers exist before the run"; exit 1
          fi
          echo "fresh: no .env, no .secrets/, no out/, no contoso-* volumes or containers"
          docker version --format 'docker {{.Server.Version}} ({{.Server.Os}}/{{.Server.Arch}})'
          docker compose version

      - name: run-all (default suites)
        working-directory: lab/pam
        run: ./test/run-all.sh

      # On failure only (see the header): collect the logs that say WHY,
      # scrub them, and only then let them leave the runner. Collection is
      # best effort (a stack that never started has no container logs); the
      # scrub is not - its failure skips the upload.
      - name: Collect + scrub failure logs
        id: scrub
        if: ${{ failure() }}
        working-directory: lab/pam
        run: |
          set -euo pipefail
          raw="$RUNNER_TEMP/pam-logs-raw"; out="$RUNNER_TEMP/pam-logs"
          mkdir -p "$raw"
          d=$(find out/test-runs -mindepth 1 -maxdepth 1 -type d 2>/dev/null | sort | tail -n 1)
          if [ -n "$d" ]; then cp "$d"/*.log "$d"/results.tsv "$raw"/ 2>/dev/null || true; fi
          for s in guacd guacamole; do
            docker compose logs --no-color --timestamps "$s" > "$raw/docker-$s.log" 2>&1 || true
          done
          docker compose --profile rdp logs --no-color --timestamps rdp-target > "$raw/docker-rdp-target.log" 2>&1 || true
          python3 -I test/scrub_logs.py --secrets .env --secrets .secrets --secrets dynamic-db/.secrets \
            --out "$out" "$raw"/*
          rm -rf "$raw"

      - name: Upload scrubbed failure logs
        if: ${{ failure() && steps.scrub.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pam-harness-failure-logs-${{ github.run_id }}
          path: ${{ runner.temp }}/pam-logs
          if-no-files-found: warn
          retention-days: 7

      - name: Per-suite table (job summary)
        if: ${{ !cancelled() }}
        working-directory: lab/pam
        run: |
          set -uo pipefail
          d=$(find out/test-runs -mindepth 1 -maxdepth 1 -type d 2>/dev/null | sort | tail -n 1)
          {
            echo "## PAM run-all (fresh clone, ${GITHUB_SHA})"
            echo
            if [ -n "$d" ] && [ -s "$d/results.tsv" ]; then
              echo "| suite | verdict | passed | failed | skipped | exit | seconds |"
              echo "|---|---|---|---|---|---|---|"
              awk -F'\t' '{ printf "| %s | %s | %s | %s | %s | %s | %s |\n", $1, $2, $3, $4, $5, $6, $7 }' "$d/results.tsv"
            else
              echo "No results.tsv: run-all stopped before its first suite (see the run-all step)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
