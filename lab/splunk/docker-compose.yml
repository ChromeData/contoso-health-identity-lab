# =============================================================================
# lab/splunk/docker-compose.yml - Splunk Enterprise as the SECOND SIEM (LOCAL ONLY)
# -----------------------------------------------------------------------------
# STAND-IN: Splunk Enterprise 60-DAY TRIAL (the real product, time-limited
# license) replaces a production Splunk deployment. The data path into it is a
# REPLAY from Log Analytics (ingest-from-loganalytics.sh), standing in for the
# Splunk Add-on for Microsoft Azure / Event Hub streaming used in production.
# Both are listed in lab/docs/STAND-INS.md and named on camera.
#
# LICENSING - THE HUMAN ACCEPTS IT, NOT A SCRIPT:
#   The 10.x image refuses to start unless BOTH variables below are set to the
#   exact acceptance strings. They are deliberately NOT generated by
#   splunk-up.sh. Read the Splunk General Terms
#   (https://www.splunk.com/en_us/legal/splunk-general-terms.html) and, only if
#   you accept them, add these two lines to lab/splunk/.env yourself:
#       SPLUNK_START_ARGS=--accept-license
#       SPLUNK_GENERAL_TERMS=--accept-sgt-current-at-splunk-com
#   (Names/values verified 2026-10 against the splunk/splunk Docker Hub page and
#   docker-splunk's entrypoint.sh.) Leaving them unset makes `docker compose`
#   itself fail with the message in the ${VAR:?...} below.
#   On first boot Splunk installs a 60-day Enterprise Trial license. When it
#   expires you choose: switch the license group to Free (Settings ->
#   Licensing) - per Splunk's "About Splunk Free", defined alerts then no
#   longer trigger while scheduled searches still run - or buy a license.
#   Record inside the window.
#
# IMAGE: splunk/splunk:10.4.4 - a patch release of the 10.4 line, pushed
#   2026-10-01 (>2 weeks old when pinned), verified to exist on Docker Hub.
#   Docker Hub lists ONLY linux/amd64 for every splunk/splunk tag (checked
#   10.0.11 / 10.2.8 / 10.4.4 / 10.6.0), so `platform: linux/amd64` is set and
#   on Apple Silicon it runs under emulation: Docker Desktop with "Use Rosetta
#   for x86_64/amd64 emulation" on, or `colima start --vz-rosetta --cpu 4
#   --memory 8`. Expect a slow first boot (5-15 min). Bump the tag
#   deliberately, never to `latest`.
#
# SECURITY:
#   * Every port binds to 127.0.0.1 only (Web 8000, HEC 8088, REST 8089).
#   * Admin password + HEC token come from .env (generated by splunk-up.sh,
#     mode 0600, gitignored). HIDE_PASSWORD keeps them out of the provisioning
#     log. They are visible to anyone who can `docker inspect` this container -
#     acceptable on a single-user laptop, not in production.
#   * HEC uses Splunk's self-signed certificate; clients on this laptop use
#     `curl -k` against 127.0.0.1 only.
#
# DETECTIONS: ./app/contoso_identity is bind-mounted as a Splunk app. It
#   creates the `entra` index, JSON extraction for the replayed sourcetypes and
#   the five scheduled alerts rendered from ./detections/*.spl.
# =============================================================================

name: contoso-splunk

services:
  splunk:
    image: splunk/splunk:10.4.4
    platform: linux/amd64            # no arm64 image is published (see header)
    hostname: splunk-idlab
    environment:
      # --- license acceptance: the operator sets these in .env, by hand -----
      SPLUNK_START_ARGS: ${SPLUNK_START_ARGS:?Read https://www.splunk.com/en_us/legal/splunk-general-terms.html then, only if you accept, set SPLUNK_START_ARGS=--accept-license in lab/splunk/.env yourself}
      SPLUNK_GENERAL_TERMS: ${SPLUNK_GENERAL_TERMS:?Read https://www.splunk.com/en_us/legal/splunk-general-terms.html then, only if you accept, set SPLUNK_GENERAL_TERMS=--accept-sgt-current-at-splunk-com in lab/splunk/.env yourself}
      # --- generated by splunk-up.sh --------------------------------------------
      SPLUNK_PASSWORD: ${SPLUNK_PASSWORD:?run ./splunk-up.sh first}
      SPLUNK_HEC_TOKEN: ${SPLUNK_HEC_TOKEN:?run ./splunk-up.sh first}
      # --- provisioning behaviour (splunk-ansible variables) ---------------------
      HIDE_PASSWORD: "true"          # keep the password out of the ansible log on stdout
      SPLUNK_DISABLE_POPUPS: "false" # "true" makes splunk-ansible call the REST API 10 s after start, which fails under amd64 emulation (GET OptInVersion) and restart-loops the container; dismiss the first-run popups by hand instead
      # The image recursively chowns $SPLUNK_HOME to the splunk user by default.
      # With the detections app bind-mounted from this git checkout that would
      # rewrite ownership of repo files on Linux hosts and can fail outright on
      # some macOS file-sharing back ends, so it is turned off. The named
      # volumes below are seeded from the image with the right ownership already.
      # verify: first boot completes with this off (watch `docker compose logs`).
      SPLUNK_HOME_OWNERSHIP_ENFORCEMENT: "false"
      # strftime() in the SPL prints %z; UTC keeps output aligned with KQL.
      TZ: UTC
    ports:
      - "127.0.0.1:8000:8000"        # Splunk Web
      - "127.0.0.1:8088:8088"        # HTTP Event Collector (HTTPS, self-signed)
      - "127.0.0.1:8089:8089"        # management REST API (splunk-up.sh checks)
    volumes:
      # etc is NOT a volume: under Colima/vz the named volume came up empty instead of seeded from the image,
      # so Splunk's own apps (splunk_httpinput for HEC) were missing and the start loop failed. Ansible re-creates
      # the config from the environment on every start, so nothing in etc needs to persist.
      - splunk-var:/opt/splunk/var
      # Detections-as-code app. Not :ro so Splunk can write the app's local/
      # directory if someone edits an alert in the UI (that local/ dir is
      # gitignored - edit detections/*.spl instead and re-render).
      # The detections app is copied in AFTER first boot by splunk-up.sh (docker cp + restart). Mounting it here
      # made /opt/splunk/etc non-empty before the image's /sbin/updateetc.sh ran, which then skipped seeding the
      # stock config, so Splunk's own apps (splunk_httpinput for HEC) were missing and the start loop failed.
    # The image ships its own HEALTHCHECK (/sbin/checkstate.sh, 3 min start
    # period); splunk-up.sh waits on it.
    restart: unless-stopped

volumes:
  splunk-var:
