# =============================================================================
# contoso_identity :: limits.conf
# -----------------------------------------------------------------------------
# Search-time automatic JSON extraction stops after a fixed number of
# characters / fields. A SigninLogs row (dozens of columns plus the
# ConditionalAccessPolicies array) can exceed those defaults, which would make
# late fields silently "missing" in a base search - the worst kind of
# detection failure, because the alert just never fires.
#
# Three layers of defence:
#   1. ingest-from-loganalytics.sh writes the detection-critical columns FIRST
#      in every event, so they are always inside the extraction window.
#   2. The detections read nested / array fields with explicit
#      `spath path=...`, which is not limited by the extract-all cut-off.
#   3. These limits are raised for this lab instance (limits.conf from an app
#      is merged globally; system/local still wins if someone sets it there).
#
# Setting names and defaults checked 2026-10 against the Splunk Enterprise
# 10.4 limits.conf spec: [kv] limit default 100, maxchars default 10240
# characters; [spath] extraction_cutoff default 5000 bytes (Splunk Cloud docs
# give its range as 2500-2000000, and say it also bounds auto-KV extraction).
# verify: that an app-level limits.conf takes effect on the pinned image
# (btool limits list kv --debug inside the container shows the winning file).
# =============================================================================

[kv]
# Max fields auto-KV may create per event.
limit = 500
# Characters of _raw considered by auto-KV.
maxchars = 204800

[spath]
# Bytes of an event that extract-all JSON extraction (auto-KV and bare
# `spath`) will read.
extraction_cutoff = 204800
