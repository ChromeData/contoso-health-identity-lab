[Contoso - Tier-0 logon on DC01 without a Vault check-out]
description = Tier-0 logon on DC01 that PAM does not account for: a vaulted tier0-admin with no Vault check-out, the RID-500 break-glass Administrator, or any other account with special privileges (4672) the vault does not manage. KQL twin: lab/kql/tier0-logon-without-checkout.kql
disabled = 0
enableSched = 1
cron_schedule = */5 * * * *
dispatch.earliest_time = -3h
dispatch.latest_time = now
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
alert.severity = 5
alert.expires = 7d
alert.digest_mode = 0
alert.suppress = 1
alert.suppress.fields = Account
alert.suppress.period = 1h
request.ui_dispatch_app = search
request.ui_dispatch_view = search
search = index=entra (sourcetype="azure:loganalytics:securityevent" OR sourcetype="azure:loganalytics:vaultcheckout_cl") earliest=-3h latest=now \
| eval Kind=if(sourcetype=="azure:loganalytics:vaultcheckout_cl", "vault", "logon") \
| eval Host=upper(mvindex(split(coalesce(Computer, ""), "."), 0)) \
| eval Account=lower(case(Kind=="vault", Account, EventID==4672, SubjectUserName, true(), TargetUserName)) \
| eval AccountDomain=case(Kind=="vault", null(), EventID==4672, SubjectDomainName, true(), TargetDomainName) \
| eval AccountSid=case(Kind=="vault", null(), EventID==4672, SubjectUserSid, true(), TargetUserSid) \
| eval Class=case(Kind=="vault", null(), in(Account, "tier0-admin-01", "tier0-admin-02"), "Vaulted", match(coalesce(AccountSid, ""), "-500$"), "BreakGlassAd", EventID==4672, "Unvaulted", true(), null()) \
| where (Kind=="vault" AND in(Operation, "check-out", "check-in", "heartbeat")) OR (Kind=="logon" AND in(EventID, 4624, 4672) AND in(Host, "DC01") AND isnotnull(Class) AND NOT match(coalesce(Account, ""), "[$]$") AND NOT in(coalesce(AccountSid, ""), "S-1-5-18", "S-1-5-19", "S-1-5-20", "S-1-0-0", "S-1-5-7") AND NOT match(coalesce(AccountSid, ""), "^S-1-5-(90|96)-") AND NOT in(Account, "svc-vault-rotator")) \
| eval VaultTime=if(Kind=="vault", _time, null()) \
| eventstats max(VaultTime) AS VaultFeedLastSeenEpoch \
| where Kind=="logon" OR Operation!="heartbeat" \
| eval OrigTime=_time \
| eval OutOrig=if(Kind=="vault" AND Operation=="check-out", OrigTime, null()), InOrig=if(Kind=="vault" AND Operation=="check-in", OrigTime, null()) \
| eval _time=case(isnotnull(OutOrig), OrigTime - 300, isnotnull(InOrig), OrigTime + 300, true(), OrigTime) \
| sort 0 Account _time \
| streamstats last(OutOrig) AS LastOut last(InOrig) AS LastIn BY Account \
| where Kind=="logon" \
| where OrigTime>=relative_time(now(), "-75m") AND OrigTime<=relative_time(now(), "-15m") \
| eval SessionEnd=case(isnull(LastOut), null(), isnotnull(LastIn) AND LastIn>=LastOut, min(LastIn, LastOut + 3600), true(), LastOut + 3600) \
| eval Covered=if(Class=="Vaulted" AND isnotnull(SessionEnd) AND OrigTime<=SessionEnd + 300, 1, 0) \
| where Covered==0 \
| eval LogonBin=floor(OrigTime / 600) * 600 \
| stats max(OrigTime) AS LastLogonEpoch, min(OrigTime) AS FirstLogonEpoch, count AS UncoveredEvents, values(EventID) AS EventIds, values(LogonType) AS LogonTypes, values(IpAddress) AS SourceIps, values(WorkstationName) AS Workstations, first(AccountSid) AS AccountSid, max(LastOut) AS LastCheckoutBeforeEpoch, first(VaultFeedLastSeenEpoch) AS VaultFeedLastSeenEpoch BY Account AccountDomain Host Computer Class LogonBin \
| eval SourceIps=mvfilter(SourceIps!="" AND SourceIps!="-") \
| eval SourceIp=mvindex(SourceIps, 0) \
| eval VaultFeedHealthy=if(isnotnull(VaultFeedLastSeenEpoch) AND VaultFeedLastSeenEpoch > relative_time(now(), "-30m"), "true", "false") \
| eval Verdict=case(Class=="BreakGlassAd", "RID-500 (AD break-glass) logon on a DC - always reviewed under the AD break-glass procedure", Class=="Unvaulted", "Account with Tier-0 privileges (4672) on a DC that the PAM vault does not manage - a new Domain Admin or an unvaulted admin", VaultFeedHealthy=="true", "No Vault check-out covers this Tier-0 logon - credential used outside PAM", true(), "No check-out found AND the Vault feed is stale - check ingest-vault-audit.sh before assuming misuse") \
| eval Severity="High" \
| eval _time=LastLogonEpoch \
| eval TimeGenerated=strftime(LastLogonEpoch, "%Y-%m-%dT%H:%M:%S.%3N%z"), FirstLogon=strftime(FirstLogonEpoch, "%Y-%m-%dT%H:%M:%S.%3N%z"), LastCheckoutBefore=strftime(LastCheckoutBeforeEpoch, "%Y-%m-%dT%H:%M:%S.%3N%z"), VaultFeedLastSeen=strftime(VaultFeedLastSeenEpoch, "%Y-%m-%dT%H:%M:%S.%3N%z") \
| sort 0 - _time \
| table TimeGenerated, Severity, Verdict, Class, Account, AccountDomain, AccountSid, Host, Computer, FirstLogon, UncoveredEvents, EventIds, LogonTypes, SourceIp, SourceIps, Workstations, LastCheckoutBefore, VaultFeedHealthy, VaultFeedLastSeen

# Source: lab/splunk/detections/vault-privileged-access-anomaly.spl
[Contoso - PAM vault anomaly (PTA-equivalent)]
description = Vault stand-in misuse: Tier-0 credential read or check-out outside a ticket, rotation failure, root-token use, failed vault login bursts, Tier-0 access denied. KQL twin: lab/kql/vault-privileged-access-anomaly.kql
disabled = 0
enableSched = 1
cron_schedule = */5 * * * *
dispatch.earliest_time = -6h
dispatch.latest_time = now
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
alert.severity = 5
alert.expires = 7d
alert.digest_mode = 0
alert.suppress = 1
alert.suppress.fields = Actor,Signal
alert.suppress.period = 1h
request.ui_dispatch_app = search
request.ui_dispatch_view = search
search = index=entra sourcetype="azure:loganalytics:vaultcheckout_cl" earliest=-6h latest=now \
| where Operation!="heartbeat" \
| eventstats count(Ticket) AS TicketFieldRows \
| eval Ticket=coalesce(Ticket, ""), Operator=coalesce(Operator, ""), ErrorText=coalesce(ErrorText, ""), VaultPath=coalesce(VaultPath, "") \
| rex field=VaultPath "^auth/[^/]+/login/(?<LoginName>[^/?]+)" \
| eval LoginName=coalesce(LoginName, "") \
| eval Actor=case(Operator!="", Operator, coalesce(VaultActor, "")!="", VaultActor, true(), LoginName) \
| eval TicketValid=if(match(Ticket, "^CHG[0-9]{7}$"), "true", "false") \
| eval OrigTime=_time \
| eval OutOrig=if(Operation=="check-out" AND Library=="tier0-admins" AND Operator!="", OrigTime, null()) \
| eval SortTime=if(isnotnull(OutOrig), OrigTime - 300, OrigTime) \
| sort 0 Operator SortTime \
| streamstats last(OutOrig) AS LastOut BY Operator \
| eval CoveredByCheckout=if(Operation=="cred-read" AND isnotnull(LastOut) AND LastOut>=OrigTime - 14400, 1, 0) \
| where OrigTime>=relative_time(now(), "-1h") \
| eval Signal=case(Operation=="cred-read" AND like(VaultPath, "ldap/static-cred/tier0/%") AND TicketValid=="false" AND CoveredByCheckout==0, "Tier0CredReadUncovered", Operation=="check-out" AND Library=="tier0-admins" AND TicketFieldRows > 0 AND TicketValid=="false", "Tier0CheckoutWithoutTicket", Operation=="rotation-failed", "RotationFailed", Operation=="root-token", "RootTokenUse", Operation=="auth-failed", "AuthFailureBurst", Operation=="access-denied" AND match(VaultPath, "(^|[^A-Za-z0-9])tier0($|[^A-Za-z0-9])"), "Tier0AccessDenied", true(), "") \
| where Signal!="" \
| eval Bin=floor(OrigTime / 600) * 600 \
| eval GroupKey=case(in(Signal, "RootTokenUse", "Tier0AccessDenied"), Actor . "|" . coalesce(RemoteAddress, "") . "|" . Bin, Signal=="AuthFailureBurst", coalesce(RemoteAddress, "") . "|" . Bin, true(), coalesce(RequestId, "") . "|" . coalesce(Account, "")) \
| eval NonLabRootPath=if(in(VaultPath, "auth/token/create", "auth/token/revoke", "sys/audit-hash/file"), null(), VaultPath) \
| eval IsAuditTamper=if(match(VaultPath, "^sys/audit/"), 1, 0) \
| eval IsTier0Rotation=if(match(VaultPath, "(^|[^A-Za-z0-9])tier0($|[^A-Za-z0-9])") OR VaultPath=="ldap/rotate-root" OR Library=="tier0-admins", 1, 0) \
| eval IsConsumerRead=0, NamedLogin=if(LoginName!="", LoginName, null()) \
| stats max(OrigTime) AS LastEpoch, min(OrigTime) AS FirstEpoch, count AS Events, first(Actor) AS Actor, first(Operator) AS Operator, first(VaultActor) AS VaultActor, first(Ticket) AS Ticket, first(Account) AS Account, first(Library) AS Library, first(LoginName) AS LoginName, values(NamedLogin) AS LoginNames, first(RemoteAddress) AS RemoteAddress, first(SourceHost) AS SourceHost, first(TokenPolicies) AS TokenPolicies, values(VaultPath) AS VaultPaths, values(ErrorText) AS Errors, values(RequestId) AS RequestIds, values(NonLabRootPath) AS NonLabRootPaths, max(IsAuditTamper) AS AuditTamper, max(IsTier0Rotation) AS Tier0Rotation, max(IsConsumerRead) AS ConsumerRead BY Signal GroupKey \
| where Signal!="AuthFailureBurst" OR Events >= 5 \
| eval VaultPath=mvindex(VaultPaths, 0), VaultPaths=mvindex(VaultPaths, 0, 9), Errors=mvindex(Errors, 0, 4), RequestIds=mvindex(RequestIds, 0, 9), NonLabRootPaths=mvindex(NonLabRootPaths, 0, 9), LoginNames=mvindex(LoginNames, 0, 9) \
| eval Severity=case(Signal=="Tier0CredReadUncovered" AND ConsumerRead==1, "Low", in(Signal, "Tier0CredReadUncovered", "Tier0CheckoutWithoutTicket"), "High", Signal=="RotationFailed" AND Tier0Rotation==1, "High", Signal=="RotationFailed", "Medium", Signal=="RootTokenUse" AND (AuditTamper==1 OR coalesce(mvcount(NonLabRootPaths), 0) > 0), "High", Signal=="RootTokenUse", "Low", Signal=="AuthFailureBurst" AND coalesce(mvcount(LoginNames), 0) > 0, "High", true(), "Medium") \
| eval CyberArkAnalogue=case(Signal=="Tier0CredReadUncovered", "PTA-style: retrieval outside a ticketed request", Signal=="Tier0CheckoutWithoutTicket", "Master Policy dual control / ticketing bypassed", Signal=="RotationFailed", "CPM change failed", Signal=="RootTokenUse", "Built-in Vault Administrator used", Signal=="AuthFailureBurst", "PTA-style: failed Vault logon burst", true(), "Safe permission violation") \
| eval _time=LastEpoch \
| eval TimeGenerated=strftime(LastEpoch, "%Y-%m-%dT%H:%M:%S.%3N%z"), FirstSeen=strftime(FirstEpoch, "%Y-%m-%dT%H:%M:%S.%3N%z") \
| sort 0 - _time \
| table TimeGenerated, Severity, Signal, CyberArkAnalogue, Actor, Operator, VaultActor, Ticket, Account, Library, LoginName, LoginNames, VaultPath, VaultPaths, Events, Errors, NonLabRootPaths, AuditTamper, RemoteAddress, SourceHost, TokenPolicies, FirstSeen, RequestIds

