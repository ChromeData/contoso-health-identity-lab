description = RDP or interactive logon on DC01, or a network logon from a public IP, whose source is not on the operator_ips allowlist (ADR 0013). High on success. KQL twin: lab/kql/dc-logon-outside-operator-allowlist.kql
disabled = 0
enableSched = 1
cron_schedule = */5 * * * *
dispatch.earliest_time = -1h
dispatch.latest_time = now
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
