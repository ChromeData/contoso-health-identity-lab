[Contoso - Credential added to an application or service principal]
description = A new secret, certificate or federated identity credential on an app registration or service principal. KQL twin: lab/kql/app-credential-added.kql
disabled = 0
enableSched = 1
cron_schedule = */5 * * * *
dispatch.earliest_time = -1h
dispatch.latest_time = now
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
alert.severity = 4
alert.expires = 7d
alert.digest_mode = 0
alert.suppress = 1
alert.suppress.fields = Actor,Severity
alert.suppress.period = 1h
request.ui_dispatch_app = search
request.ui_dispatch_view = search
search = index=entra sourcetype="azure:loganalytics:auditlogs" Category="ApplicationManagement" earliest=-1h latest=now \
| where Category=="ApplicationManagement" AND lower(Result)=="success" \
| where match(OperationName, "(?i)(Add service principal credentials|Certificates and secrets management)") OR (lower(OperationName)=="update application" AND like(_raw, "%FederatedIdentityCredentials%")) \
| spath path=InitiatedBy.user.userPrincipalName output=ActorUpn \
| spath path=InitiatedBy.user.id output=ActorObjectId \
| spath path=InitiatedBy.app.displayName output=ActorApp \
| spath path=InitiatedBy.app.servicePrincipalId output=ActorAppSpId \
| spath path=InitiatedBy.app.appId output=ActorAppId \
| spath path=InitiatedBy.user.ipAddress output=ActorUserIp \
| spath path=InitiatedBy.app.ipAddress output=ActorAppIp \
| eval ActorIp=if(isnotnull(ActorUserIp) AND ActorUserIp!="", ActorUserIp, ActorAppIp) \
| eval Actor=if(isnotnull(ActorUpn) AND ActorUpn!="", ActorUpn, ActorApp) \
| spath path=TargetResources{} output=TR \
| eval TRMatch=mvfilter(match(spath(TR, "type"), "(?i)^(Application|ServicePrincipal)$")) \
| eval TR1=mvindex(TRMatch, 0) \
| eval TargetName=spath(TR1, "displayName"), TargetObjectId=spath(TR1, "id"), TargetType=spath(TR1, "type") \
| eval MP=spath(TR1, "modifiedProperties{}") \
| eval MPMatch=mvfilter(match(spath(MP, "displayName"), "(?i)^(KeyDescription|FederatedIdentityCredentials)$")) \
| eval MP1=mvindex(MPMatch, 0) \
| eval ChangedProperty=spath(MP1, "displayName"), OldValue=coalesce(spath(MP1, "oldValue"), ""), NewValue=spath(MP1, "newValue") \
| where isnotnull(ChangedProperty) AND ChangedProperty!="" \
| eval FirstCredential=if(OldValue=="" OR OldValue=="[]", "true", "false") \
| eval EventKey=CorrelationId . "|" . _time . "|" . TargetObjectId \
| eval NewItem=json_array_to_mv(NewValue) \
| mvexpand NewItem \
| rex field=NewItem "KeyIdentifier=(?<KeyId>[^,]+)" \
| rex field=NewItem "KeyType=(?<KeyType>[^,]+)" \
| eval FicIssuer=coalesce(spath(NewItem, "Issuer"), spath(NewItem, "issuer")), FicSubject=coalesce(spath(NewItem, "Subject"), spath(NewItem, "subject")) \
| eval ItemKey=coalesce(KeyId, FicSubject, NewItem) \
| where NOT like(OldValue, "%" . ItemKey . "%") \
| stats count AS AddedCount, values(KeyType) AS KeyTypes, values(FicIssuer) AS FicIssuers, values(FicSubject) AS FicSubject, first(_time) AS _time, first(TimeGenerated) AS TimeGenerated, first(Actor) AS Actor, first(ActorUpn) AS ActorUpn, first(ActorObjectId) AS ActorObjectId, first(ActorApp) AS ActorApp, first(ActorAppSpId) AS ActorAppSpId, first(ActorAppId) AS ActorAppId, first(ActorIp) AS ActorIp, first(OperationName) AS OperationName, first(TargetType) AS TargetType, first(TargetName) AS TargetName, first(TargetObjectId) AS TargetObjectId, first(ChangedProperty) AS ChangedProperty, first(FirstCredential) AS FirstCredential, first(CorrelationId) AS CorrelationId BY EventKey \
| eval CredentialKind=case(lower(ChangedProperty)=="federatedidentitycredentials", "FederatedIdentityCredential", isnotnull(mvfind(KeyTypes, "^Password$")), "ClientSecret", isnotnull(mvfind(KeyTypes, "^AsymmetricX509Cert$")), "Certificate", true(), "Other") \
| lookup contoso_iac_principals.csv principal_id AS ActorAppSpId OUTPUT principal_id AS IacBySp \
| lookup contoso_iac_principals.csv principal_id AS ActorAppId OUTPUT principal_id AS IacByApp \
| eval IsIac=if(isnotnull(IacBySp) OR isnotnull(IacByApp), "true", "false") \
| eval IacNameSpoof=if(IsIac=="false" AND lower(coalesce(ActorApp, ""))=="gh-oidc-entra-apply (write)", "true", "false") \
| eval Severity=case(IacNameSpoof=="true", "High", IsIac=="true", "Low", lower(TargetType)=="serviceprincipal" OR CredentialKind=="FederatedIdentityCredential", "High", true(), "Medium") \
| sort 0 - _time \
| table TimeGenerated, Severity, Actor, ActorUpn, ActorObjectId, ActorApp, ActorAppSpId, ActorIp, IsIac, IacNameSpoof, OperationName, TargetType, TargetName, TargetObjectId, CredentialKind, KeyTypes, FicIssuers, FicSubject, AddedCount, FirstCredential, CorrelationId

# Source: lab/splunk/detections/auth-method-changed-by-admin.spl
[Contoso - Authentication method changed by an admin for another user]
description = An admin registered, updated or deleted another user's MFA or passwordless method (incl. TAP); High for privileged targets (id list, a role or privileged-group grant in the last 2 days, or break-glass / Tier-0 naming). KQL twin: lab/kql/auth-method-changed-by-admin.kql
disabled = 0
enableSched = 1
cron_schedule = */5 * * * *
dispatch.earliest_time = -2d
dispatch.latest_time = now
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
alert.severity = 4
alert.expires = 7d
alert.digest_mode = 0
alert.suppress = 1
alert.suppress.fields = Actor,Severity
alert.suppress.period = 1h
request.ui_dispatch_app = search
request.ui_dispatch_view = search
search = index=entra sourcetype="azure:loganalytics:auditlogs" (Category="UserManagement" OR Category="RoleManagement" OR Category="GroupManagement") earliest=-2d latest=now \
| where lower(Result)=="success" \
| eval OpL=lower(OperationName), CatL=lower(Category) \
| eval IsChange=if(CatL=="usermanagement" AND _time>=relative_time(now(), "-1h") AND (in(OpL, "admin registered security info", "admin updated security info", "admin deleted security info") OR (OpL=="update user" AND like(_raw, "%StrongAuthentication%"))), "true", "false") \
| eval IsGrantOp=if(in(CatL, "rolemanagement", "groupmanagement") AND in(OpL, "add member to role", "add member to group", "add owner to group", "add eligible member to role in pim completed (permanent)", "add eligible member to role in pim completed (timebound)", "add member to role in pim completed (permanent)", "add member to role in pim completed (timebound)"), "true", "false") \
| where IsChange=="true" OR IsGrantOp=="true" \
| spath path=TargetResources{} output=TR \
| eval TR1=mvindex(mvfilter(match(spath(TR, "type"), "(?i)^User$")), 0) \
| eval TargetUpn=spath(TR1, "userPrincipalName"), TargetObjectId=spath(TR1, "id") \
| eval TRGroup=mvindex(mvfilter(match(spath(TR, "type"), "(?i)^Group$")), 0), TRRole=mvindex(mvfilter(match(spath(TR, "type"), "(?i)^Role$")), 0) \
| eval GroupIdFromTarget=spath(TRGroup, "id"), TargetsText=mvjoin(TR, " ") \
| rex field=TargetsText "Group[.]ObjectID[^}]*newValue[^0-9A-Fa-f}]*(?<GroupIdFromProps>[0-9A-Fa-f-]{36})" \
| rex field=TargetsText "Group[.]DisplayName[^}]*newValue[^A-Za-z0-9}]*(?<GroupNameFromProps>[A-Za-z0-9][A-Za-z0-9 _.-]*)" \
| rex field=TargetsText "Role[.]DisplayName[^}]*newValue[^A-Za-z0-9}]*(?<RoleNameFromProps>[A-Za-z0-9][A-Za-z0-9 _.-]*)" \
| eval GrantGroupId=coalesce(GroupIdFromTarget, GroupIdFromProps), GrantGroupName=coalesce(spath(TRGroup, "displayName"), GroupNameFromProps), GrantRoleName=coalesce(spath(TRRole, "displayName"), RoleNameFromProps) \
| lookup contoso_privileged_groups.csv group_id AS GrantGroupId OUTPUT group_id AS GrantPrivGroupHit \
| eval IsGroupGrant=if(in(OpL, "add member to group", "add owner to group") OR CatL=="groupmanagement" OR (isnotnull(GroupIdFromTarget) AND GroupIdFromTarget!=""), "true", "false") \
| eval PrivilegedGrant=if(IsGrantOp=="true" AND ((IsGroupGrant=="false" AND CatL=="rolemanagement") OR (IsGroupGrant=="true" AND (isnotnull(GrantPrivGroupHit) OR in(lower(coalesce(GrantGroupName, "")), "break-glass-admins", "privileged-iam-admins", "pim-azure-rg-contributors") OR match(coalesce(GrantGroupName, ""), "^PIM-Tier")))), "true", "false") \
| eval Grant=case(PrivilegedGrant=="true" AND IsGroupGrant=="true", "group " . coalesce(GrantGroupName, GrantGroupId, "(unnamed)") . " (" . OperationName . ")", PrivilegedGrant=="true", "role " . coalesce(GrantRoleName, "(unnamed)") . " (" . OperationName . ")") \
| eval GrantEpoch=if(isnotnull(Grant), _time, null()) \
| eventstats values(Grant) AS RecentGrants, max(GrantEpoch) AS LastGrantEpoch BY TargetObjectId \
| where IsChange=="true" \
| spath path=InitiatedBy.user.userPrincipalName output=ActorUpn \
| spath path=InitiatedBy.user.id output=ActorObjectId \
| spath path=InitiatedBy.app.displayName output=ActorApp \
| spath path=InitiatedBy.user.ipAddress output=ActorUserIp \
| spath path=InitiatedBy.app.ipAddress output=ActorAppIp \
| eval ActorIp=if(isnotnull(ActorUserIp) AND ActorUserIp!="", ActorUserIp, ActorAppIp) \
| eval Actor=if(isnotnull(ActorUpn) AND ActorUpn!="", ActorUpn, ActorApp) \
| where isnull(ActorObjectId) OR ActorObjectId=="" OR ActorObjectId!=TargetObjectId \
| rex field=ResultReason "(?i)admin (registered|updated|deleted) (?<MethodFromReason>.+?) method" \
| eval Method=if(isnotnull(MethodFromReason) AND MethodFromReason!="", MethodFromReason, if(lower(OperationName)=="update user", "legacy per-user MFA (StrongAuthentication*)", "")) \
| eval Action=case(match(OperationName, "(?i)registered"), "Registered", match(OperationName, "(?i)updated"), "Updated", match(OperationName, "(?i)deleted"), "Deleted", true(), "Updated") \
| eval IsTap=if(match(coalesce(ResultReason, ""), "(?i)temporary access pass"), "true", "false") \
| lookup contoso_privileged_identities.csv object_id AS TargetObjectId OUTPUT object_id AS PrivIdHit \
| eval PrivilegedById=if(isnotnull(PrivIdHit), "true", "false") \
| eval LastGrant=if(isnotnull(LastGrantEpoch), strftime(LastGrantEpoch, "%Y-%m-%dT%H:%M:%SZ"), null()) \
| eval PrivilegedByGrant=if(isnotnull(TargetObjectId) AND TargetObjectId!="" AND isnotnull(RecentGrants), "true", "false") \
| eval PrivilegedByName=if(match(coalesce(TargetUpn, ""), "(?i)^(bg-admin-[0-9]{2}|tier0-admin-[0-9]{2})@"), "true", "false") \
| eval PrivilegedTarget=if(PrivilegedById=="true" OR PrivilegedByName=="true" OR PrivilegedByGrant=="true", "true", "false") \
| eval PrivilegeBasis=case(PrivilegedById=="true", "privileged id list", PrivilegedByGrant=="true", "role or privileged-group grant in the grant history", PrivilegedByName=="true", "naming convention (fallback)", true(), "none") \
| eval Severity=if(PrivilegedTarget=="true", "High", "Medium") \
| sort 0 - _time \
| table TimeGenerated, Severity, Action, Method, IsTap, TargetUpn, TargetObjectId, PrivilegedTarget, PrivilegedById, PrivilegedByGrant, PrivilegeBasis, RecentGrants, LastGrant, Actor, ActorUpn, ActorObjectId, ActorApp, ActorIp, OperationName, ResultReason, CorrelationId

# Source: lab/splunk/detections/blocked-country-signin.spl
[Contoso - Sign-in from a blocked or watched country]
description = Sign-in from a country on the block or watch list; Outcome separates CA blocks, wrong-password noise and the real gap (a successful sign-in from a block-list country). KQL twin: lab/kql/blocked-country-signin.kql
disabled = 0
enableSched = 1
cron_schedule = */5 * * * *
dispatch.earliest_time = -1h
dispatch.latest_time = now
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
alert.severity = 4
alert.expires = 7d
alert.digest_mode = 0
alert.suppress = 1
alert.suppress.fields = UserPrincipalName,IPAddress
alert.suppress.period = 1h
request.ui_dispatch_app = search
request.ui_dispatch_view = search
search = index=entra sourcetype="azure:loganalytics:signinlogs" earliest=-1h latest=now \
| spath path=LocationDetails.countryOrRegion output=GeoCountry \
| eval Country=if(isnotnull(GeoCountry) AND GeoCountry!="", GeoCountry, Location) \
| where in(upper(Country), "KP", "IR", "RU", "CN", "SY", "CU") \
| spath path=ConditionalAccessPolicies{} output=CAP \
| eval BlockingCAP=mvfilter(spath(CAP, "result")=="failure") \
| eval BlockingPolicies=mvdedup(mvmap(BlockingCAP, spath(BlockingCAP, "displayName"))) \
| eval ListType=if(in(upper(Country), "KP", "IR", "SY", "CU"), "block", "watch") \
| eval Blocked=if(ConditionalAccessStatus=="failure", "true", "false") \
| eval Outcome=case(Blocked=="true", "Blocked by CA", ResultType=="0" AND ListType=="block", "SUCCEEDED - CA gap", ResultType=="0", "Succeeded - watch list", in(ResultType, "50126", "50034", "50053", "50056", "50057"), "Failed first factor - CA not reached", true(), "Other failure - review (password may be valid)") \
| sort 0 - _time \
| table TimeGenerated, UserPrincipalName, UserDisplayName, Country, ListType, IPAddress, AppDisplayName, Outcome, Blocked, ConditionalAccessStatus, BlockingPolicies, ResultType, ResultDescription, RiskLevelDuringSignIn

