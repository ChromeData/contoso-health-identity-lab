# =============================================================================
# contoso_identity :: props.conf
# -----------------------------------------------------------------------------
# Search-time JSON extraction for the three replayed Log Analytics tables.
#
# STAND-IN NOTE: these sourcetypes carry the LOG ANALYTICS schema (column
# names exactly as in KQL: UserPrincipalName, ResultType, LocationDetails...),
# because the data is replayed from loga-idlab by ingest-from-loganalytics.sh.
# They are deliberately NOT named like the production add-on sourcetypes: the
# Splunk Add-on for Microsoft Azure (Graph inputs) and Event Hub inputs deliver
# a different field layout, so reusing their names would apply the wrong
# field aliases if that add-on were ever installed alongside.
#
#   KQL table                          Splunk sourcetype
#   SigninLogs                         azure:loganalytics:signinlogs
#   AADNonInteractiveUserSignInLogs    azure:loganalytics:aadnoninteractiveusersigninlogs
#   AuditLogs                          azure:loganalytics:auditlogs
#
# ITDR pack (lab/kql + detections/ identity-risk, tier0-logon-without-checkout).
# Declared here so the SPL twins have their sourcetypes ready. The replay
# (ingest-from-loganalytics.sh) carries these tables when they are named with
# -T (not by default), once each table has data in Log Analytics.
#   AADUserRiskEvents                  azure:loganalytics:aaduserriskevents
#   AADRiskyUsers                      azure:loganalytics:aadriskyusers
#   SecurityEvent (DC01 via AMA)       azure:loganalytics:securityevent
#   VaultCheckout_CL (PAM check-outs)  azure:loganalytics:vaultcheckout_cl
#   AzureDiagnostics (Key Vault        azure:loganalytics:azurediagnostics
#     AuditEvent rows; keyvault-bulk-secret-read.spl). No feed or replay
#     sends it yet: the twin runs and finds nothing until one does.
#
# _time comes from the HEC envelope ("time" = TimeGenerated), so no
# TIME_PREFIX/TIME_FORMAT is needed. TRUNCATE is raised because a SigninLogs
# row with many Conditional Access policies easily passes the 10 KB default.
# The detections still read nested/array fields with explicit `spath path=...`
# so they do not depend on auto-extraction cut-offs (see limits.conf).
# =============================================================================

[azure:loganalytics:signinlogs]
description = Entra interactive sign-ins replayed from Log Analytics (SigninLogs schema)
category = Custom
pulldown_type = 0
KV_MODE = json
TRUNCATE = 1000000

[azure:loganalytics:aadnoninteractiveusersigninlogs]
description = Entra non-interactive sign-ins replayed from Log Analytics (AADNonInteractiveUserSignInLogs schema)
category = Custom
pulldown_type = 0
KV_MODE = json
TRUNCATE = 1000000

[azure:loganalytics:auditlogs]
description = Entra audit events replayed from Log Analytics (AuditLogs schema)
category = Custom
pulldown_type = 0
KV_MODE = json
TRUNCATE = 1000000

[azure:loganalytics:aaduserriskevents]
description = Entra ID Protection risk detections replayed from Log Analytics (AADUserRiskEvents schema)
category = Custom
pulldown_type = 0
KV_MODE = json
TRUNCATE = 1000000

[azure:loganalytics:aadriskyusers]
description = Entra ID Protection risky-user state replayed from Log Analytics (AADRiskyUsers schema)
category = Custom
pulldown_type = 0
KV_MODE = json
TRUNCATE = 1000000

[azure:loganalytics:securityevent]
description = DC01 Windows Security events (AMA) replayed from Log Analytics (SecurityEvent schema)
category = Custom
pulldown_type = 0
KV_MODE = json
TRUNCATE = 1000000

[azure:loganalytics:vaultcheckout_cl]
description = Vault Tier-0 library check-out / check-in rows replayed from Log Analytics (VaultCheckout_CL, written by lab/scripts/monitoring/ingest-vault-audit.sh)
category = Custom
pulldown_type = 0
KV_MODE = json
TRUNCATE = 1000000

[azure:loganalytics:azurediagnostics]
description = Key Vault AuditEvent rows from Log Analytics (AzureDiagnostics schema). Not fed yet
category = Custom
pulldown_type = 0
KV_MODE = json
TRUNCATE = 1000000
