# =============================================================================
# contoso_identity :: app.conf
# -----------------------------------------------------------------------------
# STAND-IN: this app runs inside the Splunk Enterprise 60-day TRIAL container
# (lab/splunk/docker-compose.yml), standing in for production Splunk. It is the
# Splunk half of "detections as code": the rules in lab/kql, as SPL (one
# lab/splunk/detections/*.spl twin per .kql).
#
# What the app carries (all in default/, all reviewed in git):
#   indexes.conf        the `entra` index the replayed Entra logs land in
#   props.conf          JSON field extraction for the replayed sourcetypes
#   limits.conf         lifts auto-extraction cut-offs for large sign-in events
#   transforms.conf     lookup definitions a file-name lookup cannot express
#                       (contoso_operator_ips: CIDR match)
#   savedsearches.conf  GENERATED from lab/splunk/detections/*.spl by
#                       lab/splunk/render-savedsearches.sh - do not hand-edit
#   ../lookups/         the exact-match lookup CSVs (header-only in git)
#   ../metadata/default.meta  shares everything system-wide (Search app sees it)
#
# Edits made in Splunk Web land in local/ (gitignored) and silently diverge
# from git. Change the .spl file and re-render instead.
# =============================================================================

[install]
is_configured = 1
state = enabled

[ui]
# No dashboards or views of its own; the alerts show up in the Search app
# (Search & Reporting -> Alerts) because metadata exports them globally.
is_visible = 0
label = Contoso Identity Detections

[launcher]
author = Contoso Health Identity Platform lab
description = Entra ID, AD and PAM identity detections (sign-in hygiene, PIM, ITDR) translated from lab/kql to SPL, one lab/splunk/detections/*.spl per rule.
version = 1.0.0

[package]
id = contoso_identity
check_for_updates = 0
