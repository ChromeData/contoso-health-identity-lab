# =============================================================================
# contoso_identity :: indexes.conf
# -----------------------------------------------------------------------------
# The one index this lab uses. ingest-from-loganalytics.sh sends every event
# with "index":"entra", and splunk-up.sh restricts the HEC token to it.
#
# Sized for a lab (trial license, laptop disk): 2 GB cap, 90-day retention.
# Entra sign-in + audit volume for a ~10-user tenant is a few MB a day, far
# inside the trial's daily indexing allowance (verify: the trial's daily GB
# cap in the license shown under Settings -> Licensing).
# Production would size retention to the compliance requirement (HIPAA audit
# logs: 6 years) on SmartStore/remote storage, not a laptop volume.
# =============================================================================

[entra]
homePath   = $SPLUNK_DB/entra/db
coldPath   = $SPLUNK_DB/entra/colddb
thawedPath = $SPLUNK_DB/entra/thaweddb
maxTotalDataSizeMB = 2048
frozenTimePeriodInSecs = 7776000
