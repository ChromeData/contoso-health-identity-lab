# =============================================================================
# contoso_identity :: transforms.conf
# -----------------------------------------------------------------------------
# Lookup DEFINITIONS, for the lookups a plain `lookup <file>.csv` cannot
# express. The exact-match lookups (contoso_iac_principals.csv,
# contoso_privileged_groups.csv, contoso_privileged_identities.csv,
# contoso_sod_holdings.csv, and since 2026-11-07 contoso_operator_principals.csv,
# contoso_break_glass_users.csv and contoso_trusted_asns.csv, header-only until
# filled with the same ids Terraform renders) are referenced by file name and
# need no stanza.
#
# contoso_operator_ips - the Splunk twin of the Sentinel watchlist
# operator_ips (modules/monitoring, fed from operator_ip_ranges; ADR 0013),
# read by detections/dc-logon-outside-operator-allowlist.spl. Columns
# IpRange,Owner,ExpiresOn (yyyy-mm-dd). CIDR match on IpRange, so a /32 row
# matches the logon's SourceIp; max_matches lets one address hit several
# rows (an expired one and its renewal) so the search can keep the
# unexpired one. The CSV holds the operator's IP, which is sensitive: it is
# gitignored (lab/splunk/.gitignore), splunk-up.sh creates it header-only
# (mode 0600) when missing, and the operator fills it with the same /32 rows
# as Terraform operator_ip_ranges. Empty = every DC01 logon alerts.
# =============================================================================

[contoso_operator_ips]
filename = contoso_operator_ips.csv
match_type = CIDR(IpRange)
max_matches = 10
