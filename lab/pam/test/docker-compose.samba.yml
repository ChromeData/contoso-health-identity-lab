# =============================================================================
# lab/pam/test/docker-compose.samba.yml - Samba AD DC01 for the e2e harness
# -----------------------------------------------------------------------------
# Override file: adds ONE service to the contoso-pam project so the PAM
# scripts can be rehearsed without Azure. Used only by test/e2e.sh:
#
#   docker compose -f docker-compose.yml -f test/docker-compose.samba.yml ...
#
# Paths below are relative to lab/pam/ (the directory of the FIRST -f file),
# not to this file.
#
# SECURITY: no published ports - Vault, Guacamole and the assertions reach the
# DC over the project network only. Credentials are compose secrets (files in
# .secrets/test/, 0600, generated by e2e.sh), so they never show up in
# `docker inspect` the way environment variables would.
# =============================================================================

services:
  samba-dc:
    build: ./test/samba-ad
    image: contoso-pam/samba-ad-test:local
    # tini as PID 1: forwards SIGTERM to samba and reaps its worker processes.
    init: true
    # The DC's DNS host name is hostname.domainname - the name the entrypoint
    # puts in the LDAPS certificate's subjectAltName, which Vault verifies.
    hostname: dc01
    domainname: corp.test.local
    environment:
      SAMBA_REALM: CORP.TEST.LOCAL
      SAMBA_DOMAIN: CORP
    # Deliberately NO network alias dc01.corp.test.local: Vault must reach the
    # DC through the extra_hosts mapping vault-onboard-ad.sh writes to .env,
    # exactly as with DC01. An alias would resolve the name for every
    # container and hide a broken mapping. (Inside samba-dc the name resolves
    # from hostname + domainname in its own /etc/hosts.)
    secrets:
      - samba_admin_password
      - svc_vault_rotator_password
      - svc_backup_password
      - svc_pam_discovery_password
    volumes:
      - samba-dc:/var/lib/samba
    healthcheck:
      # Healthy = LDAPS answers with a certificate that verifies against the
      # DC's own CA for the name dc01.corp.test.local.
      test: ["CMD-SHELL", "LDAPTLS_CACERT=/var/lib/samba/private/tls/ca.pem ldapsearch -LLL -x -H ldaps://dc01.corp.test.local -s base -b '' dnsHostName >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 60s
    restart: unless-stopped

secrets:
  samba_admin_password:
    file: ./.secrets/test/samba-admin-password
  svc_vault_rotator_password:
    file: ./.secrets/test/svc-vault-rotator-password
  svc_backup_password:
    file: ./.secrets/test/svc-backup-password
  svc_pam_discovery_password:
    file: ./.secrets/test/svc-pam-discovery-password

volumes:
  samba-dc:
