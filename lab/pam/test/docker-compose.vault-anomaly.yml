# =============================================================================
# lab/pam/test/docker-compose.vault-anomaly.yml - Vault + Samba AD for
# test/e2e-vault-anomaly.sh (LOCAL ONLY, $0). A SEPARATE compose project
# (contoso-vaultanom): it never touches the shared contoso-pam stack, its
# Vault, its ldap/ mount or its Samba DC, so the main harness and real
# onboarding are unaffected and the two can run on the same laptop.
#
#   docker compose -p contoso-vaultanom --project-directory lab/pam \
#     -f lab/pam/test/docker-compose.vault-anomaly.yml ...
#   (test/e2e-vault-anomaly.sh does this for you; paths below are relative
#   to lab/pam/, the project directory, like test/docker-compose.samba.yml)
#
#   vault     HashiCorp Vault 2.1.1 (same image as the shared stack), file
#             audit device -> the records ingest-vault-audit.sh turns into
#             VaultCheckout_CL rows
#   samba-dc  the e2e harness's Samba AD DC image (test/samba-ad): a REAL
#             LDAPS directory, so check-out, static-role reads, rotation and a
#             rotation FAILURE (DC stopped) are real Vault LDAP-engine events
#
# SECURITY
#   * samba-dc sits ONLY on `adnet`, an internal network: no published port,
#     no route out. Vault is on adnet (LDAPS to the DC) and on `default` (for
#     its loopback-only API port).
#   * Every published port binds to 127.0.0.1.
#   * Samba's passwords are compose file secrets from .secrets/vault-anomaly/
#     (0700 dir, 0600 files, gitignored), generated by the harness and never
#     printed; `docker inspect` does not show them.
#   * Vault image pinned by version AND digest (as docker-compose.dynamic-db.yml).
# =============================================================================

name: contoso-vaultanom

services:
  vault:
    image: hashicorp/vault:2.1.1@sha256:47f14a6acb98f48d798a07df7c83f23a6e636e1cf724c5f8ff165cb32667a1e2
    command: server
    cap_add: [IPC_LOCK]
    ulimits:
      memlock:
        soft: -1
        hard: -1
    environment:
      VAULT_ADDR: http://127.0.0.1:8200
    # 8200 = shared stack, 8210-8212 = HA cluster, 8220 = dynamic-db
    ports: ["127.0.0.1:8230:8200"]
    volumes:
      - ./test/vault-anomaly/vault.hcl:/vault/config/vault.hcl:ro
      - vault-data:/vault/file
      - vault-logs:/vault/logs
    networks: [default, adnet]
    restart: unless-stopped

  samba-dc:
    build: ./test/samba-ad
    image: contoso-pam/samba-ad-test:local
    init: true
    hostname: dc01
    domainname: corp.test.local
    environment:
      SAMBA_REALM: CORP.TEST.LOCAL
      SAMBA_DOMAIN: CORP
    secrets:
      - samba_admin_password
      - svc_vault_rotator_password
      - svc_backup_password
      - svc_pam_discovery_password
    volumes:
      - samba-dc:/var/lib/samba
    networks:
      adnet:
        # Its own isolated project: the name resolves through this alias (the
        # shared harness tests the extra_hosts mapping instead; not needed here).
        aliases: [dc01.corp.test.local]
    healthcheck:
      test: ["CMD-SHELL", "LDAPTLS_CACERT=/var/lib/samba/private/tls/ca.pem ldapsearch -LLL -x -H ldaps://dc01.corp.test.local -s base -b '' dnsHostName >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 60s
    # NOT unless-stopped: the harness stops the DC on purpose (rotation
    # failure) and must not have Docker bring it back behind its back.
    restart: "no"

secrets:
  samba_admin_password:
    file: ./.secrets/vault-anomaly/samba-admin-password
  svc_vault_rotator_password:
    file: ./.secrets/vault-anomaly/svc-vault-rotator-password
  svc_backup_password:
    file: ./.secrets/vault-anomaly/svc-backup-password
  svc_pam_discovery_password:
    file: ./.secrets/vault-anomaly/svc-pam-discovery-password

networks:
  adnet:
    internal: true

volumes:
  vault-data:
  vault-logs:
  samba-dc:
