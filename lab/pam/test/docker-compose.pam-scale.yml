# =============================================================================
# lab/pam/test/docker-compose.pam-scale.yml - Vault + Samba AD + pam-tools for
# test/e2e-scale.sh (LOCAL ONLY, $0). A SEPARATE compose project
# (contoso-pamscale): the 500-account run never touches the shared
# contoso-pam stack, its Vault, its ldap/ mount or its Samba DC.
#
# The harness exports COMPOSE_PROJECT_NAME=contoso-pamscale and
# COMPOSE_FILE=test/docker-compose.pam-scale.yml, so the REAL scripts it
# drives (discover.sh, onboard.sh, rotate.sh, reconcile.sh - their plain
# `docker compose exec vault` / `run pam-tools`) land in this project.
# With no --project-directory, compose takes THIS file's directory as the
# project directory: paths below are relative to lab/pam/test/.
#
#   vault      HashiCorp Vault 2.1.1 (same image as the shared stack), file
#              storage, file audit device on (enabled by the harness)
#   samba-dc   the e2e harness's Samba AD DC image (samba-ad/): base layout at
#              first start, then seed-accounts.py --bulk adds the population
#   pam-tools  the toolbox image (../tools): discover.py, ldapwhoami
#
# SECURITY
#   * samba-dc sits ONLY on `adnet`, an internal network: no published port,
#     no route out. Vault and pam-tools reach it there (network alias
#     dc01.corp.test.local, the name in its LDAPS certificate).
#   * Vault's API is published on 127.0.0.1:8240 only.
#     (8200 shared stack, 8210-8212 HA, 8220 dynamic-db, 8230 vault-anomaly)
#   * Samba's passwords are compose file secrets from .secrets/pam-scale/
#     (0700 dir, 0600 files, gitignored), generated by the harness and never
#     printed; `docker inspect` does not show them.
#   * Vault image pinned by version AND digest (as the other harnesses).
# =============================================================================

name: contoso-pamscale

services:
  vault:
    image: hashicorp/vault:2.1.1@sha256:47f14a6acb98f48d798a07df7c83f23a6e636e1cf724c5f8ff165cb32667a1e2
    command: server
    cap_add: [IPC_LOCK]
    ulimits:
      memlock:
        soft: -1
        hard: -1
    environment:
      VAULT_ADDR: http://127.0.0.1:8200
    ports: ["127.0.0.1:8240:8200"]
    volumes:
      - ./pam-scale/vault.hcl:/vault/config/vault.hcl:ro
      - vault-data:/vault/file
      - vault-logs:/vault/logs
      - ../.secrets/pam-scale/vault-ca:/vault/ca:ro     # the DC's root CA (public)
    networks: [default, adnet]
    restart: unless-stopped

  samba-dc:
    build: ./samba-ad
    image: contoso-pam/samba-ad-test:local
    init: true
    hostname: dc01
    domainname: corp.test.local
    environment:
      SAMBA_REALM: CORP.TEST.LOCAL
      SAMBA_DOMAIN: CORP
    secrets:
      - samba_admin_password
      - svc_vault_rotator_password
      - svc_backup_password
      - svc_pam_discovery_password
    volumes:
      - samba-dc:/var/lib/samba
    networks:
      adnet:
        aliases: [dc01.corp.test.local]
    healthcheck:
      test: ["CMD-SHELL", "LDAPTLS_CACERT=/var/lib/samba/private/tls/ca.pem ldapsearch -LLL -x -H ldaps://dc01.corp.test.local -s base -b '' dnsHostName >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 60s
    restart: "no"

  # Same hardening as the shared stack's pam-tools: read-only, no
  # capabilities, unprivileged user (image), scripts mounted read-only.
  pam-tools:
    build: ../tools
    image: contoso-pam/pam-tools:local
    profiles: ["tools"]            # never started by `up`; discover.sh / reconcile.sh `run` it
    entrypoint: ["python3"]
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      LDAPTLS_CACERT: /pam/ca/ad-root-ca.pem
    volumes:
      - ../tools:/pam/tools:ro
      - ../pam-policy.json:/pam/pam-policy.json:ro
      - ../.secrets/pam-scale/vault-ca:/pam/ca:ro
    networks: [adnet]

secrets:
  samba_admin_password:
    file: ../.secrets/pam-scale/samba-admin-password
  svc_vault_rotator_password:
    file: ../.secrets/pam-scale/svc-vault-rotator-password
  svc_backup_password:
    file: ../.secrets/pam-scale/svc-backup-password
  svc_pam_discovery_password:
    file: ../.secrets/pam-scale/svc-pam-discovery-password

networks:
  adnet:
    internal: true

volumes:
  vault-data:
  vault-logs:
  samba-dc:
