# Conjur policy for the state-leak experiment (loaded into root by run.sh).
#
# One secret, one machine identity allowed to read it, through a layer (so a
# second runner is one !grant, not a second permit). Same statements and
# privileges as lab/pam/conjur/policy.yml. run.sh checks the runner really can
# fetch the value before Terraform runs, so a later failure is not a policy
# mistake.
- !policy
  id: state-leak
  body:
    - !variable
      id: db-password
      annotations:
        description: Random value written by run.sh for one run; never a real credential.

    - !host
      id: terraform-runner
      annotations:
        description: The identity Terraform uses (API key, rotated every run).

    - !layer runners

    - !grant
      role: !layer runners
      member: !host terraform-runner

    - !permit
      role: !layer runners
      privileges: [ read, execute ]
      resource: !variable db-password
