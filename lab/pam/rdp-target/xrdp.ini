; =============================================================================
; xrdp.ini for rdp-target (Linux xrdp stand-in for DC01 - lab only).
; TLS only (no classic RDP security), autologon with the client's credentials
; straight into the Xorg session (no xrdp login dialog), no clipboard / drive /
; sound / RemoteApp channels. Logs go to the console (docker logs) as well.
; =============================================================================
[Globals]
ini_version=1
fork=true
port=3389
use_vsock=false
tcp_nodelay=true
tcp_keepalive=true
security_layer=tls
crypt_level=high
certificate=/etc/xrdp/tls/cert.pem
key_file=/etc/xrdp/tls/key.pem
ssl_protocols=TLSv1.2, TLSv1.3
; credentials from the client (Guacamole injects them) go straight to [Xorg]
autorun=Xorg
allow_channels=true
allow_multimon=false
bitmap_cache=true
bitmap_compression=true
bulk_compression=true
max_bpp=24
new_cursors=true
use_fastpath=both

[Logging]
LogFile=/var/log/xrdp.log
LogLevel=INFO
EnableSyslog=false
EnableConsole=true
ConsoleLevel=INFO

[Channels]
rdpdr=false
rdpsnd=false
drdynvc=false
cliprdr=false
rail=false
xrdpvr=false

[Xorg]
name=Xorg
lib=libxup.so
username=ask
password=ask
port=-1
code=20
