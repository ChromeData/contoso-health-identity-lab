; =============================================================================
; sesman.ini for rdp-target (Linux xrdp stand-in for DC01 - lab only).
; Only members of rdp-admins (the AD accounts the entrypoint maps) and never
; root; one login attempt per connection; a disconnected session is killed at
; once (each check-out starts clean, nothing lingers after check-in).
; =============================================================================
[Globals]
EnableUserWindowManager=false
UserWindowManager=startwm.sh
DefaultWindowManager=startwm.sh
ReconnectScript=reconnectwm.sh

[Security]
AllowRootLogin=false
MaxLoginRetry=1
TerminalServerUsers=rdp-admins
TerminalServerAdmins=rdp-admins
AlwaysGroupCheck=true
RestrictOutboundClipboard=all
RestrictInboundClipboard=all

[Sessions]
X11DisplayOffset=10
MaxSessions=4
KillDisconnected=true
DisconnectedTimeLimit=0
IdleTimeLimit=0
Policy=Default

[Logging]
LogFile=/var/log/xrdp-sesman.log
LogLevel=INFO
EnableSyslog=false
EnableConsole=true
ConsoleLevel=INFO

[Xorg]
param=/usr/lib/xorg/Xorg
param=-config
param=xrdp/xorg.conf
param=-noreset
param=-nolisten
param=tcp
param=-logfile
param=.xorgxrdp.%s.log

[Chansrv]
FuseMountName=thinclient_drives
FileUmask=077

[ChansrvLogging]
LogLevel=INFO
EnableSyslog=false
EnableConsole=false

[SessionVariables]
