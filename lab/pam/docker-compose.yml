# =============================================================================
# lab/pam/docker-compose.yml - PAM / IGA stand-ins (LOCAL ONLY, $0)
# -----------------------------------------------------------------------------
# Every stand-in and what it replaces: lab/docs/STAND-INS.md
#
#   vault        HashiCorp Vault Community  -> CyberArk Digital Vault + CPM
#                (LDAP secrets engine rotates real AD accounts on DC01)
#   guacd/guac   Apache Guacamole           -> CyberArk PSM (recorded sessions)
#   conjur       CyberArk Conjur OSS        -> Conjur Enterprise / Secrets Manager
#   midpoint     Evolveum midPoint          -> SailPoint / Saviynt (IGA)
#   itsm-mock    ServiceNow Table API mock  -> ServiceNow change tickets (PDI at
#                                              tenant time) for ticket-gated check-out
#   pam-tools    LDAP/SSH toolbox (profile "tools", run on demand by
#                discover.sh / reconcile.sh) -> CyberArk Accounts Discovery
#   ssh-target   Linux host, Vault SSH CA only (profile "ssh", psm-ssh.sh)
#                                           -> a PSM-for-SSH / PSMP target
#   rdp-target   Linux + xrdp, AD Kerberos logon (profile "rdp", harness only)
#                                           -> STAND-IN for an RDP session to
#                                              DC01 (Samba AD has no RDP)
#
# Opt-in extras are compose PROFILES, so `docker compose up -d` (pam-up.sh)
# starts exactly what it did before plus the ITSM mock. The 3-node Raft HA
# cluster is a separate project: docker-compose.ha.yml (./vault-ha.sh).
#
# SECURITY: every port binds to 127.0.0.1 only. All credentials come from
# .env, generated by pam-up.sh (gitignored). Image tags are pinned; bump
# deliberately. Conjur publishes amd64 images only - on Apple Silicon it runs
# under emulation (Colima: `colima start --vz-rosetta --cpu 4 --memory 8`, or
# Docker Desktop with Rosetta enabled).
# =============================================================================

name: contoso-pam

services:
  # ---------------------------------------------------------------- Vault ---
  vault:
    image: hashicorp/vault:2.1.1
    command: server
    # mlock keeps secrets out of swap. Docker's default memlock ulimit is too
    # small for Vault (fails with "Failed to lock memory"), so lift it.
    cap_add: [IPC_LOCK]
    ulimits:
      memlock:
        soft: -1
        hard: -1
    environment:
      VAULT_ADDR: http://127.0.0.1:8200
    ports: ["127.0.0.1:8200:8200"]
    volumes:
      - ./vault/vault.hcl:/vault/config/vault.hcl:ro
      - vault-data:/vault/file
      - vault-logs:/vault/logs
      - ./.secrets/vault-ca:/vault/ca:ro          # AD root CA (PEM) for LDAPS trust
    # DC01's FQDN must match its LDAPS certificate; resolve it to the DC's
    # public IP (the NSG admits only your IP). Values set by vault-onboard-ad.sh
    # (or test/e2e.sh: dc01.corp.test.local -> the Samba AD container).
    extra_hosts:
      - "${DC_FQDN:-dc01.invalid}:${DC_PUBLIC_IP:-127.0.0.1}"
    restart: unless-stopped

  # ------------------------------------------------------------ Guacamole ---
  # guacd (uid 1000) WRITES session recordings, the web app (uid 1001) plays
  # them back. A new named volume is root:root 0755, so without this one-shot
  # step guacd cannot create a recording and every session runs UNRECORDED
  # (guacd only logs a warning). 2750 + setgid: guacd owns, group 1001 reads,
  # nobody else. UIDs are those of the pinned 1.6.0 images.
  guac-recordings-init:
    image: guacamole/guacd:1.6.0
    user: "0:0"
    entrypoint: ["sh", "-c", "chown 1000:1001 /recordings && chmod 2750 /recordings"]
    volumes:
      - guac-recordings:/recordings
    restart: "no"

  guacd:
    image: guacamole/guacd:1.6.0
    depends_on:
      guac-recordings-init:
        condition: service_completed_successfully
    volumes:
      - guac-recordings:/var/lib/guacamole/recordings
    restart: unless-stopped

  guac-db:
    image: postgres:16.15
    environment:
      POSTGRES_DB: guacamole_db
      POSTGRES_USER: guacamole_user
      POSTGRES_PASSWORD: ${GUAC_DB_PASSWORD:?run pam-up.sh first}
    volumes:
      - guac-db:/var/lib/postgresql/data
      - ./guacamole/initdb.sql:/docker-entrypoint-initdb.d/initdb.sql:ro
    restart: unless-stopped

  guacamole:
    image: guacamole/guacamole:1.6.0
    depends_on: [guacd, guac-db]
    environment:
      GUACD_HOSTNAME: guacd
      POSTGRESQL_HOSTNAME: guac-db
      POSTGRESQL_DATABASE: guacamole_db
      POSTGRESQL_USER: guacamole_user          # 1.5.x name
      POSTGRESQL_USERNAME: guacamole_user      # 1.6.x name (verify; both are harmless)
      POSTGRESQL_PASSWORD: ${GUAC_DB_PASSWORD:?run pam-up.sh first}
      # Enables in-browser playback of session recordings (History tab).
      RECORDING_SEARCH_PATH: /var/lib/guacamole/recordings
    ports: ["127.0.0.1:8081:8080"]
    volumes:
      - guac-recordings:/var/lib/guacamole/recordings
    restart: unless-stopped

  # --------------------------------------------------------------- Conjur ---
  conjur-db:
    image: postgres:16.15
    environment:
      # The image default (as on guac-db/midpoint-db), stated so the Conjur
      # quickstart's `password` (cleartext on the wire) is not copied back in.
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      POSTGRES_PASSWORD: ${CONJUR_DB_PASSWORD:?run pam-up.sh first}
    volumes:
      - conjur-db:/var/lib/postgresql/data
    restart: unless-stopped

  conjur:
    image: cyberark/conjur:1.27.0
    platform: linux/amd64
    command: server
    depends_on: [conjur-db]
    environment:
      DATABASE_URL: postgres://postgres:${CONJUR_DB_PASSWORD}@conjur-db/postgres
      CONJUR_DATA_KEY: ${CONJUR_DATA_KEY:?run pam-up.sh first}
      CONJUR_AUTHENTICATORS: authn
    ports: ["127.0.0.1:8083:80"]
    restart: unless-stopped

  conjur-cli:
    image: cyberark/conjur-cli:9.2.4
    platform: linux/amd64
    entrypoint: ["sleep", "infinity"]
    volumes:
      - ./conjur:/policy:ro
    restart: unless-stopped

  # -------------------------------------------------------------- midPoint ---
  # Mirrors Evolveum's documented native-PostgreSQL compose (verify against the
  # midPoint 4.10 docker docs if the init step changes).
  midpoint-db:
    image: postgres:16.15
    environment:
      POSTGRES_DB: midpoint
      POSTGRES_USER: midpoint
      POSTGRES_PASSWORD: ${MIDPOINT_DB_PASSWORD:?run pam-up.sh first}
      POSTGRES_INITDB_ARGS: --lc-collate=en_US.utf8 --lc-ctype=en_US.utf8
    volumes:
      - midpoint-db:/var/lib/postgresql/data
    restart: unless-stopped

  midpoint-init:
    image: evolveum/midpoint:4.10.4
    depends_on: [midpoint-db]
    command: >
      bash -c "cd /opt/midpoint &&
      bin/midpoint.sh init-native &&
      if bin/ninja.sh -B info 2>&1 | grep -q ERROR; then
        bin/ninja.sh run-sql --create --mode REPOSITORY &&
        bin/ninja.sh run-sql --create --mode AUDIT;
      else echo 'midPoint repository already initialised'; fi"
    environment: &midpoint_env
      MP_SET_midpoint_repository_database: postgresql
      MP_SET_midpoint_repository_jdbcUrl: jdbc:postgresql://midpoint-db:5432/midpoint  # trufflehog:ignore - host/db URL only; the password is ${MIDPOINT_DB_PASSWORD} from .env
      MP_SET_midpoint_repository_jdbcUsername: midpoint
      MP_SET_midpoint_repository_jdbcPassword: ${MIDPOINT_DB_PASSWORD}
      MP_INIT_CFG: /opt/midpoint/var
    volumes:
      - midpoint-home:/opt/midpoint/var
    restart: "no"

  midpoint:
    image: evolveum/midpoint:4.10.4
    depends_on:
      midpoint-init:
        condition: service_completed_successfully
    environment:
      <<: *midpoint_env
      MP_SET_midpoint_administrator_initialPassword: ${MIDPOINT_ADMIN_PASSWORD:?run pam-up.sh first}
      MP_UNSET_midpoint_repository_hibernateHbm2ddl: "1"
      MP_NO_ENV_COMPAT: "1"
    ports: ["127.0.0.1:8082:8080"]
    volumes:
      - midpoint-home:/opt/midpoint/var
    restart: unless-stopped

  # ------------------------------------------------------------ PAM ops ---
  # One locally built toolbox image (tools/Dockerfile) serves three roles.
  # Scripts are mounted read-only so an edit needs no rebuild.
  pam-tools:
    build: ./tools
    image: contoso-pam/pam-tools:local
    profiles: ["tools"]            # never started by `up`; discover.sh uses `compose run`
    entrypoint: ["python3"]
    read_only: true
    tmpfs: ["/tmp"]                # scratch for ssh key checks; gone with the container
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # Same DC mapping and AD root CA as Vault: discovery reaches DC01 (or the
    # Samba test DC) the same way rotation does, and verifies the same cert.
    extra_hosts:
      - "${DC_FQDN:-dc01.invalid}:${DC_PUBLIC_IP:-127.0.0.1}"
    environment:
      LDAPTLS_CACERT: /pam/ca/ad-root-ca.pem
    volumes:
      - ./tools:/pam/tools:ro
      - ./pam-policy.json:/pam/pam-policy.json:ro
      - ./.secrets/vault-ca:/pam/ca:ro

  # ServiceNow Table API v2 stand-in (tools/mock_servicenow.py). Tickets are
  # read from itsm/data/tickets.json on every request (./itsm-ticket.sh
  # adds them). Basic auth: the mock holds only SHA-256("user:password")
  # from .env, so `docker inspect` never shows the password itself.
  itsm-mock:
    image: contoso-pam/pam-tools:local
    build: ./tools
    entrypoint: ["python3"]
    command: ["/pam/tools/mock_servicenow.py"]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      ITSM_TICKETS_FILE: /data/tickets.json
      ITSM_AUTH_SHA256: ${ITSM_AUTH_SHA256:?run pam-up.sh first}
    ports: ["127.0.0.1:8084:8080"]
    volumes:
      - ./tools:/pam/tools:ro
      - ./itsm/data:/data:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # Linux target for the Vault SSH CA segment (ssh-target/). Certificate
  # logins only; fetches Vault's CA public key at start, so ./psm-ssh.sh
  # setup must have created the CA first. No host port: guacd and pam-tools
  # reach it on the project network.
  ssh-target:
    build: ./ssh-target
    image: contoso-pam/ssh-target:local
    profiles: ["ssh"]
    hostname: ssh-target
    environment:
      VAULT_ADDR: http://vault:8200
      SSH_CA_MOUNT: ssh-client-signer
    depends_on: [vault]
    restart: unless-stopped

  # Linux xrdp STAND-IN for an RDP session to DC01 (rdp-target/). Samba AD has
  # no RDP, so the harness brokers a recorded RDP session here instead
  # (psm-session.sh checkout --target rdp-target). It is NOT Windows: xrdp +
  # an xterm, TLS (no NLA). The only way in is an AD account's DOMAIN
  # password, checked by Kerberos against the DC that .env's mapping names (the
  # same mapping Vault uses). No host port: guacd reaches it on the project
  # network. Harness / lab only: DC01 has real RDP at tenant time.
  rdp-target:
    build: ./rdp-target
    image: contoso-pam/rdp-target:local
    profiles: ["rdp"]
    hostname: rdp-target
    init: true                     # tini reaps the session processes
    security_opt: ["no-new-privileges:true"]
    environment:
      DC_FQDN: ${DC_FQDN:-}
      RDP_AD_USERS: tier0-admin-01 tier0-admin-02
    extra_hosts:
      - "${DC_FQDN:-dc01.invalid}:${DC_PUBLIC_IP:-127.0.0.1}"
    restart: unless-stopped

volumes:
  vault-data:
  vault-logs:
  guac-db:
  guac-recordings:
  conjur-db:
  midpoint-db:
  midpoint-home:
