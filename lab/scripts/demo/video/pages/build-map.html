<!doctype html><html><head><meta charset="utf-8"><title>build map</title>
<style>
  :root{--bg:#0E0F13;--ink:#F3F2EE;--grey:#A9A7A0;--dim:#6E6D69;--card:#171920;--line:#2A2D36;--orange:#F06A35;--blue:#4D86FF;--green:#2E9E5B;--font:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}
  html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--font)}
  body::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:64px 64px;mask-image:radial-gradient(ellipse at 40% 60%,#000 30%,transparent 80%)}
  .glow{position:absolute;border-radius:50%;pointer-events:none}
  .g1{width:1200px;height:1200px;right:-420px;top:-500px;background:radial-gradient(circle,rgba(77,134,255,.18),transparent 62%)}
  .g2{width:900px;height:900px;left:-300px;bottom:-480px;background:radial-gradient(circle,rgba(240,106,53,.16),transparent 62%)}
  /* header */
  .hdr{position:absolute;left:64px;top:44px;z-index:5}
  .kick{display:inline-flex;align-items:center;gap:12px;background:#1C1D24;border:1px solid #2A2D36;border-radius:999px;padding:8px 18px 8px 10px;font-size:19px;font-weight:650}
  .kick i{width:26px;height:26px;border-radius:50%;background:#2A2A30;display:grid;place-items:center}.kick i::after{content:"";width:9px;height:9px;border-radius:50%;border:3px solid var(--orange)}
  h1{margin:14px 0 0;font-size:46px;letter-spacing:-.03em;font-weight:800;line-height:1.05}h1 em{font-style:normal;color:var(--blue)}
  .sub{font-size:21px;color:var(--grey);margin-top:8px}
  .legend{position:absolute;right:64px;top:52px;display:flex;gap:10px;z-index:5}
  .legend span{display:inline-flex;align-items:center;gap:8px;background:#1C1D24;border:1px solid #2A2D36;border-radius:999px;padding:7px 14px;font-size:15px;color:#DAD8D2;font-weight:600}
  .legend b{width:11px;height:11px;border-radius:3px;display:inline-block}
  /* map viewport */
  #vp{position:absolute;left:0;top:200px;width:1360px;height:820px;overflow:visible}
  #world{position:absolute;left:0;top:0;width:2760px;height:820px;transform-origin:0 0;transition:transform 1.05s cubic-bezier(.4,.05,.2,1)}
  .spine{position:absolute;left:120px;right:120px;top:456px;height:6px;background:var(--line);border-radius:3px}
  .spine .fill{position:absolute;left:0;top:0;height:100%;width:0;background:linear-gradient(90deg,var(--orange),#FF9B6B);border-radius:3px;transition:width 1.1s ease;box-shadow:0 0 18px rgba(240,106,53,.55)}
  .spine .cap{position:absolute;right:-18px;top:-9px;width:0;height:0;border-left:22px solid var(--line);border-top:12px solid transparent;border-bottom:12px solid transparent}
  .st{position:absolute;top:0;width:440px;height:820px}
  .st .pill{position:absolute;left:50%;top:437px;transform:translateX(-50%);display:flex;align-items:center;gap:12px;background:#1E2029;border:1.5px solid #343845;border-radius:999px;padding:10px 20px 10px 12px;white-space:nowrap;box-shadow:0 10px 30px rgba(0,0,0,.45);transition:all .6s;z-index:3}
  .st .pill .n{width:28px;height:28px;border-radius:50%;background:#2A2A30;display:grid;place-items:center;font-size:15px;font-weight:800;color:#DAD8D2}
  .st .pill .t{font-size:22px;font-weight:700;letter-spacing:-.01em}
  .st .pill .k{font-size:14px;color:var(--grey);font-weight:600}
  .st.on .pill{border-color:var(--orange);background:#23252F;box-shadow:0 0 0 5px rgba(240,106,53,.18),0 14px 40px rgba(0,0,0,.5)}
  .st.on .pill .n{background:var(--orange);color:#fff}
  .st.done .pill .n{background:var(--green);color:#fff}.st.done .pill .n::before{content:"✓"}.st.done .pill .n span{display:none}
  .tiles{position:absolute;left:0;right:0;bottom:410px;display:flex;flex-wrap:wrap;justify-content:center;align-content:flex-end;gap:12px;padding:0 4px}
  .tile{width:162px;background:var(--card);border:1.5px solid #2A2D36;border-radius:16px;overflow:hidden;opacity:.42;transform:translateY(10px) scale(.96);transition:all .6s;box-shadow:0 12px 30px rgba(0,0,0,.4)}
  .tile img{display:block;width:162px;height:92px;object-fit:cover;object-position:top left;border-bottom:1px solid #2A2D36;filter:saturate(.9)}
  .tile .ph{width:162px;height:92px;display:grid;place-items:center;font-size:28px;font-weight:800;color:#DAD8D2;border-bottom:1px solid #2A2D36;background:linear-gradient(135deg,#1C1E27,#14151B)}
  .tile .lb{padding:8px 10px 10px;font-size:14.5px;font-weight:700;line-height:1.2}
  .tile .lb small{display:block;font-size:12px;color:var(--grey);font-weight:600;margin-top:3px}
  .tile .tag{position:absolute;margin:-86px 0 0 7px;font-size:11px;font-weight:800;letter-spacing:.08em;padding:3px 7px;border-radius:6px;background:rgba(14,15,19,.85);color:#fff}
  .tile.hand .tag{color:#FFB08A}.tile.code .tag{color:#9DBBFF}
  .st.on .tile,.st.done .tile{opacity:1;transform:none}
  .st.on .tile{border-color:#3C4152;box-shadow:0 0 0 1px rgba(77,134,255,.25),0 16px 40px rgba(0,0,0,.5)}
  .st.on .tile.hand{border-color:rgba(240,106,53,.7)}.st.on .tile.code{border-color:rgba(77,134,255,.7)}
  .wire{position:absolute;left:50%;top:412px;width:0;height:30px;border-left:2px dashed #3A3E4B}
  .wire::after{content:"";position:absolute;left:-7px;bottom:-8px;width:12px;height:12px;border-radius:50%;background:var(--orange);box-shadow:0 0 12px rgba(240,106,53,.8)}
  .outs{position:absolute;left:0;right:0;top:520px;display:flex;justify-content:center;gap:12px;flex-wrap:wrap;padding:0 20px}
  .out{display:inline-flex;align-items:center;gap:10px;background:#15161C;border:1px solid #2A2D36;border-radius:12px;padding:10px 14px;font-size:16px;font-weight:650;color:#DAD8D2;opacity:.4;transform:translateY(8px);transition:all .6s .15s}
  .out b{color:var(--ink);font-weight:800}.out i{width:9px;height:9px;border-radius:50%;background:var(--green);display:inline-block;box-shadow:0 0 8px rgba(46,158,91,.8)}
  .st.on .out,.st.done .out{opacity:1;transform:none}
  .wire2{position:absolute;left:50%;top:462px;width:0;height:56px;border-left:2px dashed #3A3E4B}
  .goal{position:absolute;left:50%;top:600px;transform:translateX(-50%);white-space:nowrap;font-size:15px;color:var(--grey);font-weight:600;letter-spacing:.02em}
  /* panel */
  #panel{position:absolute;right:56px;top:214px;width:470px;bottom:56px;background:#15161C;border:1px solid #2A2D36;border-radius:24px;padding:28px 30px;box-shadow:0 24px 60px rgba(0,0,0,.5);z-index:5;opacity:0;transform:translateX(14px);transition:all .6s}
  #panel.on{opacity:1;transform:none}
  #panel .step{font-size:14px;color:var(--grey);font-weight:700;letter-spacing:.1em;text-transform:uppercase}
  #panel h2{margin:8px 0 0;font-size:36px;letter-spacing:-.025em;font-weight:800;line-height:1.05}
  #panel .goalp{font-size:21px;font-weight:700;margin-top:8px;padding-bottom:10px;border-bottom:3px solid var(--orange);display:inline-block}
  #panel p{font-size:19px;line-height:1.45;color:#CFCDC7;margin:16px 0 0}
  #panel ul{list-style:none;margin:16px 0 0;padding:0;display:grid;gap:9px}
  #panel li{display:grid;grid-template-columns:14px 1fr;gap:12px;align-items:start;font-size:17.5px;line-height:1.4;color:#DAD8D2}
  #panel li::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--blue);margin-top:9px}
  #panel .chips{position:absolute;left:30px;right:30px;bottom:26px;display:flex;gap:8px;flex-wrap:wrap}
  #panel .chip{font-size:13.5px;font-weight:800;letter-spacing:.06em;padding:7px 12px;border-radius:999px;background:#23252F;color:#DAD8D2}
  #panel .chip.hand{background:rgba(240,106,53,.18);color:#FFB08A}#panel .chip.code{background:rgba(77,134,255,.18);color:#9DBBFF}#panel .chip.done{background:rgba(46,158,91,.2);color:#8BE0A4}
  .foot{position:absolute;left:64px;bottom:34px;font-size:15px;color:var(--dim);font-weight:600;z-index:5}
</style></head><body><div class="glow g1"></div><div class="glow g2"></div>
<div class="hdr"><div class="kick"><i></i><span id="kick"></span></div><h1 id="h1"></h1><div class="sub" id="sub"></div></div>
<div class="legend"><span><b style="background:var(--orange)"></b>Signed up by hand</span><span><b style="background:var(--blue)"></b>Built as code</span><span><b style="background:#DAD8D2"></b>Real screen from the lab</span></div>
<div id="vp"><div id="world"><div class="spine"><div class="fill" id="fill"></div><div class="cap"></div></div><div id="stations"></div></div></div>
<div id="panel"><div class="step" id="pstep"></div><h2 id="ptitle"></h2><div><span class="goalp" id="pgoal"></span></div><p id="ptext"></p><ul id="pbul"></ul><div class="chips" id="pchips"></div></div>
<div class="foot" id="foot"></div>
<script>
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
let D = null, SP = 520, L0 = 120;
window.bmap = {
  init(d) {
    D = d; document.getElementById('kick').textContent = d.kick; document.getElementById('h1').innerHTML = d.title; document.getElementById('sub').textContent = d.sub || ''; document.getElementById('foot').textContent = d.foot || '';
    const W = L0 * 2 + SP * d.stations.length; document.getElementById('world').style.width = W + 'px';
    document.getElementById('stations').innerHTML = d.stations.map((s, i) => `<div class="st" id="st${i}" style="left:${L0 + SP * i}px">
      <div class="tiles">${s.tiles.map((t) => `<div class="tile ${t.kind || ''}">${t.img ? `<img src="${esc(t.img)}">` : `<div class="ph">${esc(t.glyph || '')}</div>`}<div class="tag">${esc(t.kind === 'hand' ? 'BY HAND' : t.kind === 'code' ? 'AS CODE' : '')}</div><div class="lb">${esc(t.name)}<small>${esc(t.note || '')}</small></div></div>`).join('')}</div>
      <div class="wire"></div>
      <div class="pill"><div class="n"><span>${i + 1}</span></div><div><div class="t">${esc(s.title)}</div><div class="k">${esc(s.kicker || '')}</div></div></div>
      <div class="wire2"></div>
      <div class="outs">${(s.outs || []).map((o) => `<span class="out"><i></i>${o}</span>`).join('')}</div>
      <div class="goal">${esc(s.goal || '')}</div></div>`).join('');
    this.overview(false);
  },
  overview(withPanel = true) {
    const W = L0 * 2 + SP * D.stations.length, avail = withPanel ? 1340 : 1800, sc = Math.min(avail / W, 0.62), w = document.getElementById('world');
    w.style.transform = `translate(${(withPanel ? 40 : 60) + (avail - W * sc) / 2}px, ${(820 - 820 * sc) / 2 + 30}px) scale(${sc})`;
    for (let i = 0; i < D.stations.length; i++) { const e = document.getElementById('st' + i); e.classList.remove('on'); e.classList.toggle('done', withPanel); }
    document.getElementById('fill').style.width = withPanel ? '100%' : '0%';
    const p = document.getElementById('panel');
    if (withPanel && D.overview) { this._panel(D.overview, 'Done'); p.classList.add('on'); } else p.classList.remove('on');
  },
  go(i) {
    const s = D.stations[i], sc = 1.35, cx = L0 + SP * i + SP / 2, w = document.getElementById('world');
    w.style.transform = `translate(${660 - cx * sc}px, ${470 - 456 * sc}px) scale(${sc})`;
    for (let k = 0; k < D.stations.length; k++) { const e = document.getElementById('st' + k); e.classList.toggle('on', k === i); e.classList.toggle('done', k < i); }
    const W = L0 * 2 + SP * D.stations.length; document.getElementById('fill').style.width = ((cx - L0) / (W - 2 * L0) * 100) + '%';
    this._panel(s, `Step ${i + 1} of ${D.stations.length}`); document.getElementById('panel').classList.add('on');
  },
  _panel(s, step) {
    document.getElementById('pstep').textContent = step; document.getElementById('ptitle').textContent = s.title; document.getElementById('pgoal').textContent = s.goal || '';
    document.getElementById('ptext').textContent = s.text || ''; document.getElementById('pbul').innerHTML = (s.bullets || []).map((b) => `<li>${esc(b)}</li>`).join('');
    document.getElementById('pchips').innerHTML = (s.chips || []).map((c) => `<span class="chip ${c.kind || ''}">${esc(c.text)}</span>`).join('');
  },
};
</script></body></html>
