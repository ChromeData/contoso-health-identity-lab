<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Speed run</title>
<style>
  :root{--bg:#ECEBE7;--ink:#1E1E1C;--grey:#5E5D59;--dim:#8A8984;--card:#FFFFFF;--line:#DEDCD6;--orange:#E8703A;--blue:#2F6BFF;--green:#2E9E5B;--soft:#F4F3EF;--pill:#16161A;--font:"Inter","SF Pro Display","Segoe UI",system-ui,sans-serif}
  html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--font)}
  body::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(0,0,0,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(0,0,0,.045) 1px,transparent 1px);background-size:48px 48px}
  .kick{position:absolute;left:72px;top:52px;display:inline-flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:8px 16px;font-size:15px;font-weight:700;color:var(--grey)}
  .kick i{width:10px;height:10px;border-radius:50%;background:var(--orange)}
  .count{position:absolute;right:72px;top:52px;font-size:15px;font-weight:700;color:var(--dim);letter-spacing:.08em;text-transform:uppercase}
  #stage{position:absolute;left:72px;right:72px;top:120px;bottom:72px}
  .slide{position:absolute;inset:0;display:grid;grid-template-columns:1120px 1fr;gap:56px;align-items:center;opacity:0;transform:translateY(28px) scale(.985);transition:opacity .45s ease,transform .55s cubic-bezier(.2,.8,.2,1)}
  .slide.in{opacity:1;transform:none}
  .slide.out{opacity:0;transform:translateY(-22px) scale(.99);transition:opacity .35s ease,transform .35s ease}
  .shot{width:1120px;height:700px;border-radius:22px;background:var(--card);border:1px solid var(--line);box-shadow:0 24px 70px rgba(0,0,0,.14);overflow:hidden;position:relative}
  .shot img{width:100%;height:100%;object-fit:cover;object-position:top;transform:scale(1.02);transition:transform 6s linear}
  .slide.in .shot img{transform:scale(1.1)}
  .shot .tag{position:absolute;left:18px;top:18px;background:var(--pill);color:#fff;font-size:13px;font-weight:800;letter-spacing:.08em;padding:7px 12px;border-radius:999px}
  .shot .tag.hand{background:var(--orange)}.shot .tag.code{background:var(--blue)}
  .shot .ico{position:absolute;inset:0;display:grid;place-items:center;font-size:150px;font-weight:800;color:var(--dim);background:var(--soft)}
  .txt .n{font-size:16px;font-weight:800;letter-spacing:.14em;color:var(--dim);text-transform:uppercase}
  .txt h2{margin:10px 0 0;font-size:54px;line-height:1.05;letter-spacing:-.03em;font-weight:800}
  .txt h2 em{font-style:normal;color:var(--blue)}
  .txt p{margin:16px 0 0;font-size:24px;line-height:1.4;color:var(--grey)}
  .bar{position:absolute;left:72px;right:72px;bottom:40px;height:5px;background:var(--line);border-radius:3px}
  .bar i{display:block;height:100%;width:0;background:var(--orange);border-radius:3px;transition:width .4s ease}
</style>
</head>
<body>
<div class="kick"><i></i>The whole lab in forty seconds</div>
<div class="count" id="count"></div>
<div id="stage"></div>
<div class="bar"><i id="bar"></i></div>
<script>
  // window.sr.init(slides) builds the deck; window.sr.show(i) cuts to slide i (used by the recorder on the narration clock).
  const stage = document.getElementById('stage');
  let slides = [], cur = -1;
  window.sr = {
    init(list) {
      slides = list; stage.innerHTML = '';
      list.forEach((s, i) => {
        const el = document.createElement('div'); el.className = 'slide'; el.id = 's' + i;
        const shot = s.img ? `<img src="${s.img}" alt="">` : `<div class="ico">${s.glyph || ''}</div>`;
        el.innerHTML = `<div class="shot">${shot}<span class="tag ${s.kind || ''}">${s.tag || ''}</span></div><div class="txt"><div class="n">${s.n || ''}</div><h2>${s.h}</h2><p>${s.p || ''}</p></div>`;
        stage.appendChild(el);
      });
    },
    show(i) {
      if (i === cur) return;
      if (cur >= 0) { const o = document.getElementById('s' + cur); o.classList.remove('in'); o.classList.add('out'); }
      cur = i; const el = document.getElementById('s' + i); el.classList.remove('out'); void el.offsetWidth; el.classList.add('in');
      document.getElementById('count').textContent = `${i + 1} / ${slides.length}`;
      document.getElementById('bar').style.width = `${((i + 1) / slides.length) * 100}%`;
    }
  };
</script>
</body>
</html>
