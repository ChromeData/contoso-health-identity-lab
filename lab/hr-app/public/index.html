<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contoso HR</title>
<style>
  :root { --ink:#1f2933; --muted:#5f6b7a; --line:#d9dee5; --bg:#f6f7f9; --card:#fff; --brand:#0b5cad; --ok:#1d7a46; --bad:#b42318; }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; color:var(--ink); background:var(--bg); }
  header { background:var(--brand); color:#fff; padding:12px 20px; display:flex; align-items:baseline; gap:12px; }
  header h1 { font-size:18px; margin:0; } header span { opacity:.85; font-size:13px; }
  main { max-width:1000px; margin:0 auto; padding:16px; display:grid; gap:16px; }
  section { background:var(--card); border:1px solid var(--line); border-radius:6px; padding:16px; }
  h2 { font-size:16px; margin:0 0 12px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:12px; }
  label { display:grid; gap:4px; font-size:13px; color:var(--muted); }
  input, select { font:inherit; padding:7px 8px; border:1px solid var(--line); border-radius:4px; color:var(--ink); background:#fff; }
  button { font:inherit; padding:8px 14px; border-radius:4px; border:1px solid var(--brand); background:var(--brand); color:#fff; cursor:pointer; }
  button.plain { background:#fff; color:var(--brand); padding:4px 10px; }
  button:disabled { opacity:.5; cursor:default; }
  .actions { margin-top:12px; display:flex; gap:8px; align-items:center; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th, td { text-align:left; padding:7px 6px; border-bottom:1px solid var(--line); }
  th { color:var(--muted); font-weight:600; font-size:12px; text-transform:uppercase; letter-spacing:.03em; }
  .tag { font-size:12px; padding:1px 7px; border-radius:10px; background:#eef2f7; }
  .tag.leaver { background:#fde8e7; color:var(--bad); } .tag.joiner { background:#e6f4ea; color:var(--ok); }
  #status { display:none; } #status.show { display:block; }
  #status .ok { color:var(--ok); } #status .bad { color:var(--bad); }
  .muted { color:var(--muted); font-size:13px; }
  .scroll { overflow-x:auto; }
  dialog { border:1px solid var(--line); border-radius:6px; max-width:520px; width:calc(100% - 32px); }
</style>
</head>
<body>
<header><h1>Contoso HR</h1><span>Workforce records</span></header>
<main>
  <section id="status" aria-live="polite"><h2>Last change</h2><div id="statusText"></div></section>

  <section>
    <h2>Hire a worker</h2>
    <form id="hire">
      <div class="grid">
        <label>First name <input name="givenName" required maxlength="40" autocomplete="off"></label>
        <label>Last name <input name="surname" required maxlength="40" autocomplete="off"></label>
        <label>Department <select name="dept" required></select></label>
        <label>Job <select name="jobTitle" required></select></label>
        <label>Manager <select name="manager"></select></label>
        <label>Start date <input name="startDate" type="date" required value="__TODAY__"></label>
      </div>
      <div class="actions"><button type="submit">Hire</button><span class="muted">The employee number is issued when you hire.</span></div>
    </form>
  </section>

  <section>
    <h2>Workers</h2>
    <div class="scroll"><table>
      <thead><tr><th>Employee no.</th><th>Name</th><th>Department</th><th>Job</th><th>Start</th><th>Status</th><th></th></tr></thead>
      <tbody id="rows"></tbody>
    </table></div>
  </section>
</main>

<dialog id="edit">
  <form id="change" method="dialog">
    <h2 id="editTitle">Change worker</h2>
    <div class="grid">
      <label>Department <select name="dept"></select></label>
      <label>Job <select name="jobTitle"></select></label>
      <label>Manager <select name="manager"></select></label>
      <label>Status <select name="status"><option value="joiner">Joiner</option><option value="active">Active</option><option value="leaver">Leaver</option></select></label>
      <label id="endWrap">Last working day (today or earlier: the account is switched off when you save) <input name="endDate" type="date"></label>
    </div>
    <div class="actions"><button type="submit" value="save">Save</button><button type="button" class="plain" id="cancel">Cancel</button></div>
  </form>
</dialog>

<script>
const TOKEN = '__FORM_TOKEN__';
let data = { workers: [], jobs: [], today: '' };
let editing = null;
const $ = (s, el = document) => el.querySelector(s);
const el = (tag, text, cls) => { const e = document.createElement(tag); if (text != null) e.textContent = text; if (cls) e.className = cls; return e; };
const fmtTime = (iso) => new Date(iso).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });

function fillSelect(sel, values, current, blank) {
  sel.replaceChildren();
  if (blank) sel.append(new Option(blank, ''));
  for (const [v, t] of values) sel.append(new Option(t, v));
  if (current != null) sel.value = current;
}
function depts() { return [...new Set(data.jobs.map(j => j.dept))].map(d => [d, d]); }
function jobsFor(d) { return data.jobs.filter(j => j.dept === d).map(j => [j.jobTitle, j.jobTitle]); }
function managers(except) {
  return data.workers.filter(w => w.status !== 'leaver' && w.employeeId !== except)
    .map(w => [w.employeeId, `${w.givenName} ${w.surname} (${w.jobTitle})`]);
}
function defaultManager(dept) {
  const m = data.workers.find(w => w.dept === dept && w.status !== 'leaver' && /Manager|Director/.test(w.jobTitle));
  return m ? m.employeeId : '';
}
function linkJob(form) {
  const d = form.elements.dept, j = form.elements.jobTitle;
  d.onchange = () => { fillSelect(j, jobsFor(d.value)); if (form.id === 'hire') form.elements.manager.value = defaultManager(d.value); };
}

async function load() {
  const r = await fetch('/api/workers'); data = await r.json();
  const f = $('#hire');
  const d = f.elements.dept.value || 'Nursing';
  fillSelect(f.elements.dept, depts(), d);
  fillSelect(f.elements.jobTitle, jobsFor(f.elements.dept.value));
  fillSelect(f.elements.manager, managers(), defaultManager(f.elements.dept.value), '(none)');
  const rows = $('#rows'); rows.replaceChildren();
  for (const w of data.workers.slice().sort((a, b) => a.surname.localeCompare(b.surname))) {
    const tr = el('tr');
    tr.append(el('td', w.employeeId), el('td', `${w.givenName} ${w.surname}`), el('td', w.dept), el('td', w.jobTitle), el('td', w.startDate));
    const st = el('td'); st.append(el('span', w.status === 'leaver' ? `Leaver ${w.endDate}` : w.status[0].toUpperCase() + w.status.slice(1), `tag ${w.status}`)); tr.append(st);
    const act = el('td'); const b = el('button', 'Change', 'plain'); b.type = 'button'; b.onclick = () => openEdit(w); act.append(b); tr.append(act);
    rows.append(tr);
  }
}

function openEdit(w) {
  editing = w; const f = $('#change');
  $('#editTitle').textContent = `Change ${w.givenName} ${w.surname} (${w.employeeId})`;
  fillSelect(f.elements.dept, depts(), w.dept);
  fillSelect(f.elements.jobTitle, jobsFor(w.dept), w.jobTitle);
  fillSelect(f.elements.manager, managers(w.employeeId), w.manager, '(none)');
  f.elements.status.value = w.status;
  f.elements.endDate.value = w.endDate || data.today;
  const showEnd = () => { $('#endWrap').style.display = f.elements.status.value === 'leaver' ? '' : 'none'; };
  f.elements.status.onchange = showEnd; showEnd();
  $('#edit').showModal();
}

async function post(url, body) {
  const r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Form-Token': TOKEN }, body: JSON.stringify(body) });
  const j = await r.json(); if (!r.ok) throw new Error(j.error || 'Could not save.'); return j;
}

const WORDS = { hired: 'Hired', left: 'Leaver recorded for', moved: 'Job change recorded for', rehired: 'Return recorded for', updated: 'Updated' };
function showStatus(res) {
  const box = $('#statusText'); box.replaceChildren();
  const w = res.worker;
  box.append(el('p', `${WORDS[res.kind] || 'Saved'} ${w.givenName} ${w.surname}, ${w.jobTitle} (${w.dept}). Employee number ${w.employeeId}. Saved at ${fmtTime(res.savedAt)}.`));
  const line = el('p', 'Sending to IT systems...', 'muted'); box.append(line);
  $('#status').classList.add('show');
  const t0 = Date.now();
  const poll = async () => {
    let d;
    try {
      const r = await fetch(`/api/delivery/${res.commit}`); d = await r.json();
      if (!r.ok || !d.state) throw new Error(d.error || 'no state');
    } catch {
      // A failed status check is not a failed delivery: say so, keep trying.
      if (Date.now() - t0 > 15 * 60 * 1000) { line.textContent = 'The delivery status cannot be checked. Ask IT.'; return; }
      line.textContent = 'Sending to IT systems... (status check failed, retrying)';
      setTimeout(poll, 10000); return;
    }
    if (d.state === 'accepted') { line.className = 'ok'; line.textContent = `Accepted by IT systems at ${fmtTime(d.finishedAt)}. IT confirms the account and access from here.`; return; }
    if (d.state === 'failed') { line.className = 'bad'; line.textContent = 'Not delivered. IT has the details and will contact HR.'; return; }
    if (d.state === 'local') { line.textContent = d.note; return; }
    if (Date.now() - t0 > 15 * 60 * 1000) { line.textContent = 'Still sending. IT is told if it does not arrive.'; return; }
    setTimeout(poll, 5000);
  };
  setTimeout(poll, 3000);
}

$('#hire').onsubmit = async (e) => {
  e.preventDefault(); const f = e.target; const btn = $('button[type=submit]', f); btn.disabled = true;
  try {
    const res = await post('/api/workers', Object.fromEntries(new FormData(f)));
    f.elements.givenName.value = ''; f.elements.surname.value = '';
    showStatus(res); await load();
  } catch (err) { alert(err.message); } finally { btn.disabled = false; }
};
$('#change').onsubmit = async (e) => {
  e.preventDefault(); const f = e.target;
  const body = Object.fromEntries(new FormData(f));
  if (body.status !== 'leaver') delete body.endDate;
  body.expected = editing;
  try { const res = await post(`/api/workers/${editing.employeeId}`, body); $('#edit').close(); showStatus(res); await load(); }
  catch (err) { alert(err.message); }
};
$('#cancel').onclick = () => $('#edit').close();
linkJob($('#hire')); linkJob($('#change'));
load();
</script>
</body>
</html>
