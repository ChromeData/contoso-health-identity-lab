# =============================================================================
# nightly-report: a stand-in clinical workload that needs one database
# password, and gets it with NO static secret in its path. There is no
# Kubernetes Secret, no env var, no token and no value in this file.
#
# How the credential arrives (Microsoft Learn, "Access Azure Key Vault with
# the CSI Driver Identity Provider", Workload ID):
#   1. The kubelet mounts the CSI volume "secrets-store" below. The Secrets
#      Store CSI Driver asks the kubelet for a short-lived token for THIS
#      pod's service account (clinical-apps/nightly-report), audience
#      api://AzureADTokenExchange (CSIDriver tokenRequests, set in
#      lab/terraform/k8s/platform). The token goes to the driver, never into
#      a container, and the Kubernetes API itself refuses it (wrong audience).
#   2. The Azure provider sends that token to Microsoft Entra ID. Entra checks
#      issuer, subject and audience against the federated credential in
#      lab/terraform/k8s/keyvault-trust and returns a Key Vault access token
#      for that app registration (no client secret exists).
#   3. Key Vault checks Azure RBAC: the app holds Key Vault Secrets User on
#      ONE secret (clinical-db). The driver writes only its value to
#      /mnt/secrets-store/db, a tmpfs in the pod, read-only. Never on the
#      node's disk, never in etcd (no Kubernetes Secret is synced).
#   4. Rotation needs no restart: the driver re-reads the secret every 10 s
#      and rewrites the file (pipeline stage 9 sets a new version in Key Vault
#      and checks that the SAME pod - same UID, no container restarted -
#      serves it).
#
# Admission: the ValidatingAdmissionPolicy clinical-apps-workload-identity
# (lab/terraform/k8s/identity) checks this Deployment AND the pod it creates:
# every image pinned by digest, the nightly-report identity runs only the
# approved app image, automountServiceAccountToken is false, and only the
# release pipeline's group may create a workload that runs as nightly-report
# or change one that does (judged before and after an update, so moving it
# to another service account counts). A human deployer can change nothing in
# this Deployment; it can still delete it (availability, not identity).
# Changing the app image below means changing that allowlist in Terraform too.
#
# Ownership: the namespace (PSA "restricted"), the service account and the
# SecretProviderClass come from Terraform (lab/terraform/k8s/*). This file is
# applied by lab/k8s/ci/pipeline.sh with `kubectl apply -f lab/k8s/manifests/`
# (NOT -R: negative/ holds a deliberately rejected pod used only by the test).
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nightly-report
  namespace: clinical-apps
  labels:
    app.kubernetes.io/name: nightly-report
    app.kubernetes.io/part-of: contoso-health-identity-lab
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: nightly-report
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nightly-report
        app.kubernetes.io/part-of: contoso-health-identity-lab
    spec:
      serviceAccountName: nightly-report
      # No default token in the pod: the default kube-api-access volume holds
      # a token whose audience IS the Kubernetes API. This workload never
      # calls the API, so it gets none (least privilege). The pod spec and
      # the ServiceAccount (Terraform) both say false.
      automountServiceAccountToken: false
      # No environment variables for every Service in the namespace either.
      enableServiceLinks: false
      terminationGracePeriodSeconds: 10
      securityContext:
        # PSA "restricted" (enforced on clinical-apps) needs runAsNonRoot and a
        # seccomp profile, at pod level. A CSI volume is allowed by
        # "restricted" (it is not a hostPath); the privileged part runs in
        # the driver's own namespace (lab/terraform/k8s/platform).
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nightly-report
          # Pinned by digest: the multi-arch index of busybox 1.37.0 (covers
          # linux/amd64 for CI and linux/arm64 for Apple Silicon), resolved
          # from registry-1.docker.io on 2026-10-19. The tag is informational;
          # the digest is what the kubelet pulls.
          image: docker.io/library/busybox:1.37.0@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
          # The stand-in "job": report, every 5 minutes, that the credential
          # is there, without ever printing it. `sleep & wait` + the trap let
          # SIGTERM stop the pod at once (sh as PID 1 ignores it otherwise).
          command: ["/bin/sh", "-c"]
          args:
            - |
              trap 'exit 0' TERM INT
              while true; do
                if [ -s /mnt/secrets-store/db ]; then
                  echo "$(date -u +%H:%M:%SZ) nightly-report: db credential file present (value not printed)"
                else
                  echo "$(date -u +%H:%M:%SZ) nightly-report: db credential file MISSING" >&2
                fi
                sleep 300 &
                wait $!
              done
          volumeMounts:
            - name: secrets-store
              mountPath: /mnt/secrets-store
              readOnly: true
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
          # Both probes only test that the mounted file exists and is not
          # empty (`test -s`). The command prints nothing, so the value can
          # never reach probe events or logs. (If the Entra exchange or the
          # Key Vault read fails, the pod never starts: the kubelet will not
          # start a container whose volume did not mount, and the pipeline's
          # `kubectl rollout status` fails.)
          readinessProbe:
            exec:
              command: ["/bin/test", "-s", "/mnt/secrets-store/db"]
            initialDelaySeconds: 2
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["/bin/test", "-s", "/mnt/secrets-store/db"]
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 2
            failureThreshold: 3
      volumes:
        # The only way the credential reaches this pod: an inline CSI volume
        # served by the SecretProviderClass nightly-report-db. The pod spec
        # names no token, no vault and no secret value.
        - name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: nightly-report-db
